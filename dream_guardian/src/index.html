<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>꿈의 수호신 (Dream Guardian)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container {
      position: relative;
      width: min(100vw, calc(100vh * (9 / 18)));
      height: min(100vh, calc(100vw * (18 / 9)));
      aspect-ratio: 9 / 18;
      background: #0a0a1a;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
      overflow: hidden;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    /* 상단 부유 컨트롤 버튼 */
    #top_controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      background: rgba(15, 20, 35, 0.75);
      border: 1.5px solid #28e6ff;
      color: #28e6ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(40, 230, 255, 0.25);
      transform: scale(1.08);
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <div id="top_controls">
      <button class="ctrl-btn" id="btn_cam" title="카메라 켜기/끄기 (단축키: C)">📷</button>
      <button class="ctrl-btn" id="btn_fullscreen" title="전체화면">⛶</button>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
