<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>꿈의 수호신 (Dream Guardian)</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050308; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Gowun Batang', serif;
            color: #e0f0ff;
            user-select: none;
        }
        #container {
            position: relative;
            width: min(100vw, calc(100vh * (9 / 18)));
            height: min(100vh, calc(100vw * (18 / 9)));
            aspect-ratio: 9 / 18;
            background: #000;
            box-shadow: 0 0 30px rgba(0,229,255,0.1);
            overflow: hidden;
            touch-action: auto;
        }
        @media (max-width: 500px) and (aspect-ratio: 9/18) {
            #container { width: 100vw; height: 100vh; box-shadow: none; border-radius: 0; }
        }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 5; touch-action: none; }
        #webcam { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
        #camera_status { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 26; padding: 5px; background: #10172eee; font: 12px sans-serif; pointer-events: none; }
        #camera_status[hidden] { display: none; }
        
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #0a0e1a 0%, #12061f 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 24px; color: #a8e6f0; z-index: 20; text-align: center;
            text-shadow: 0 0 10px rgba(168,230,240,0.8);
            transition: opacity 1s ease;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        @keyframes hitShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 12px); }
            40% { transform: translate(15px, -12px); }
            60% { transform: translate(-12px, 8px); }
            80% { transform: translate(12px, -8px); }
            100% { transform: translate(0, 0); }
        }
        .shake { animation: hitShake 0.4s ease-out; }

        /* Floating Top Controls for Mobile */
        #top_controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 25;
            display: flex;
            gap: 8px;
        }
        .ctrl-btn {
            background: rgba(15, 20, 35, 0.75);
            border: 1.5px solid #a8e6f0;
            color: #a8e6f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(0, 229, 255, 0.35);
        }

        /* Workout Records Modal */
        #records_modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 8, 18, 0.94);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            color: #e0f0ff;
            transition: opacity 0.3s ease;
        }
        #records_modal.hidden { display: none; }
        .records-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1.5px solid #a8e6f0; padding-bottom: 12px; margin-bottom: 16px;
        }
        .records-stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(25, 30, 55, 0.8);
            border: 1px solid rgba(168, 230, 240, 0.3);
            border-radius: 10px; padding: 12px 10px; text-align: center;
        }
        .stat-val { font-size: 20px; font-weight: bold; color: #ffd700; margin-top: 4px; }
        .stat-lbl { font-size: 12px; color: #a8e6f0; }
        .records-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .record-item {
            background: rgba(20, 25, 45, 0.7);
            border: 1px solid rgba(168, 230, 240, 0.2);
            border-radius: 8px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px;
        }
        #question_panel { position: absolute; z-index: 10; top: 30%; left: 4%; width: 92%; height: 10%; padding: 7px 10px; border: 2px solid #a8e6f0; border-radius: 12px; background: rgba(8,14,37,.9); display: flex; pointer-events:none; }
        #question_panel[hidden] { display: none; }
        #question_text { min-height: 0; width:100%; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; font: 700 clamp(24px, 7vw, 40px)/1.25 sans-serif; text-align: center; user-select: text; }
        #game_controls { position:absolute; z-index:27; left:3%; right:3%; bottom:max(10px, env(safe-area-inset-bottom)); height:64px; display:none; align-items:stretch; gap:8px; pointer-events:auto; }
        #game_controls.visible { display:flex; }
        .nav-btn, #control_hud, .pause-card { border:2px solid #a8e6f0; background:linear-gradient(180deg,#1c2a55,#090d25); color:#fff; box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 0 10px rgba(146,195,255,.3); border-radius:14px; font-family:'Gowun Batang',serif; }
        .nav-btn { width:74px; font-size:15px; font-weight:bold; cursor:pointer; touch-action:manipulation; }
        .nav-btn:active { transform:scale(.96); border-color:#ffe17b; }
        #control_hud { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 15px/1.35 sans-serif; text-shadow:0 1px 2px #000; }
        #pause_menu { position:absolute; z-index:29; bottom:84px; left:9%; width:82%; padding:14px; display:none; grid-template-columns:1fr 1fr; gap:10px; background:rgba(8,13,35,.95); border:2px solid #a8e6f0; border-radius:18px; box-shadow:0 0 25px rgba(115,185,255,.45); }
        #pause_menu.visible { display:grid; }
        #pause_menu h2 { grid-column:1/-1; margin:0; text-align:center; font-size:20px; }
        #pause_menu button { min-height:48px; border:2px solid #a8e6f0; background:#1c2a55; border-radius:12px; color:white; font:700 16px 'Gowun Batang',serif; cursor:pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.6.1629159505/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
    <script src="motion-input.js"></script>
    <script src="zone-input.js"></script>
    <script src="menu-input.js"></script>
    <script src="answer-selection.js"></script>
    <script src="question-evaluator.js"></script>
    <script src="question-speech.js"></script>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div>수호신의 꿈 속으로...</div>
            <div style="font-size:14px; margin-top:20px; color:#88b">마법진(카메라)과 마도서(CSV)를 연결 중입니다</div>
        </div>

        <div id="top_controls"><button id="btn_fullscreen" class="ctrl-btn" title="전체화면">⛶</button></div>
        <div id="camera_status" role="status" aria-live="polite" hidden></div>

        <div id="records_modal" class="hidden">
            <div class="records-header">
                <span style="font-size:20px; font-weight:bold; color:#a8e6f0;">🏆 운동 기록 & 명예의 전당</span>
                <button id="btn_close_records" class="ctrl-btn" style="width:32px; height:32px; font-size:16px;">✕</button>
            </div>
            <div class="records-stat-grid">
                <div class="stat-card"><div class="stat-lbl">🔥 총 소모 칼로리</div><div id="stat_total_cal" class="stat-val">0 kcal</div></div>
                <div class="stat-card"><div class="stat-lbl">🏃 총 달린 걸음</div><div id="stat_total_steps" class="stat-val">0보</div></div>
                <div class="stat-card"><div class="stat-lbl">🏋️ 총 스쿼트 회피</div><div id="stat_total_squats" class="stat-val">0회</div></div>
                <div class="stat-card"><div class="stat-lbl">🌟 획득 별빛(★)</div><div id="stat_total_stars" class="stat-val">0 / 15</div></div>
            </div>
            <div style="font-size:14px; font-weight:bold; margin-bottom:8px; color:#a8e6f0;">최근 수호 임무 기록</div>
            <div id="records_list" class="records-list"></div>
        </div>

        <div id="pause_menu" aria-label="일시 정지 메뉴">
            <h2>꿈의 쉼터</h2>
            <button id="btn_resume" type="button">계속하기</button>
            <button id="btn_pause_records" type="button">기록 보기</button>
            <button id="btn_pause_menu" type="button">메뉴 보기</button>
            <button id="btn_pause_home" type="button">홈으로 가기</button>
        </div>
        <div id="game_controls" aria-label="게임 직접 조작 메뉴">
            <button id="btn_home" class="nav-btn" type="button">홈으로</button>
            <div id="control_hud">마나 0/100</div>
            <button id="btn_pause" class="nav-btn" type="button">멈추기</button>
        </div>

        <video id="webcam" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="output_canvas"></canvas>
        <section id="question_panel" hidden aria-label="수학 문제">
            <div id="question_text" tabindex="0" aria-label="문제 내용"></div>
        </section>
    </div>
    
    <div style="display:none;">
        <img id="img_guardian" src="img/guardian.png" alt="Guardian">
    </div>

    <script>
        // ==========================================
        // 1. Audio System (Web Audio API)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        try { if (AudioContext) audioCtx = new AudioContext(); } catch (_) {}

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx?.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
            } else if (type === 'monster_hit') {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                const nGain = audioCtx.createGain();
                nGain.gain.setValueAtTime(1.0, now);
                nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                noise.connect(filter); filter.connect(nGain); nGain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 0.5);
                
                // Add glass shatter sound for boss
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(1200, now);
                osc2.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0.2, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.start(now); osc2.stop(now + 0.3);

            } else if (type === 'player_hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'shatter') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(2000, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'shield_deflect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.setValueAtTime(1320, now + 0.08);
                osc.frequency.setValueAtTime(1760, now + 0.16);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'jump_whoosh') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(960, now + 0.22);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'crystal_pickup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1046.5, now);
                osc.frequency.setValueAtTime(1318.5, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'warning') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(370, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'step_beat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // BGM System
        let bgmInterval = null;
        let bgmStep = 0;
        const bgmNotes = [440.00, 523.25, 587.33, 659.25, 783.99]; // Am pentatonic: A4, C5, D5, E5, G5
        let isBgmPlaying = false;

        function startBGM() {
            if (!audioCtx || isBgmPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isBgmPlaying = true;
            bgmStep = 0;
            bgmInterval = setInterval(() => {
                if(audioCtx.state === 'suspended') return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(bgmNotes[bgmStep % bgmNotes.length], now);
                bgmStep++;
                
                // Slow dreamy attack/release
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.05, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            }, 300); // 300ms per note
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = null;
            isBgmPlaying = false;
        }

        // ==========================================
        // 2. Data & CSV Parsing
        // ==========================================
        let questionDB = [];
        let dynamicLevels = [];
        let csvLoaded = false;
        let cameraReady = false;

        function ensureFallbackLevels() {
            if (dynamicLevels.length === 0) {
                dynamicLevels = [
                    { id: 1, title: "숫자의 숲 (덧뺄셈)", subLevels: [{ id: 1, title: "기초 덧셈과 뺄셈" }] },
                    { id: 2, title: "곱셈의 성 (곱나눗셈)", subLevels: [{ id: 1, title: "기초 곱셈과 나눗셈" }] },
                    { id: 3, title: "나눗셈의 미궁 (분수)", subLevels: [{ id: 1, title: "분수의 기본 연산" }] },
                    { id: 4, title: "소수의 사막 (소수)", subLevels: [{ id: 1, title: "소수의 덧셈과 뺄셈" }] },
                    { id: 5, title: "★ 나이트메어", subLevels: [{ id: 1, title: "악몽의 종합 연산" }] }
                ];
            }
            if (questionDB.length === 0) {
                questionDB = [
                    { level: 1, subLevel: 1, lvlTitle: "숫자의 숲", subTitle: "덧뺄셈", qTemp: "{A} + {B} = ?", cTemp: "A+B", wTemp: "A+B+1", va: "rand(2,9)", vb: "rand(1,9)", vc: "0", vd: "0" },
                    { level: 1, subLevel: 1, lvlTitle: "숫자의 숲", subTitle: "덧뺄셈", qTemp: "{A} - {B} = ?", cTemp: "A-B", wTemp: "A-B+1", va: "rand(6,15)", vb: "rand(1,5)", vc: "0", vd: "0" },
                    { level: 2, subLevel: 1, lvlTitle: "곱셈의 성", subTitle: "곱나눗셈", qTemp: "{A} × {B} = ?", cTemp: "A*B", wTemp: "A*B+2", va: "rand(2,9)", vb: "rand(2,9)", vc: "0", vd: "0" },
                    { level: 2, subLevel: 1, lvlTitle: "곱셈의 성", subTitle: "곱나눗셈", qTemp: "{A*B} ÷ {A} = ?", cTemp: "B", wTemp: "B+1", va: "rand(2,8)", vb: "rand(2,9)", vc: "0", vd: "0" },
                    { level: 3, subLevel: 1, lvlTitle: "나눗셈의 미궁", subTitle: "분수", qTemp: "1/{A} + 1/{A} = ?", cTemp: "'2/'+A", wTemp: "'1/'+A", va: "pick(3,4,5,7,9)", vb: "0", vc: "0", vd: "0" },
                    { level: 4, subLevel: 1, lvlTitle: "소수의 사막", subTitle: "소수", qTemp: "0.{A} + 0.{B} = ?", cTemp: "((A+B)/10).toFixed(1)", wTemp: "((A+B+1)/10).toFixed(1)", va: "rand(1,4)", vb: "rand(1,4)", vc: "0", vd: "0" }
                ];
            }
        }

        function checkReady() {
            if (csvLoaded) {
                ensureFallbackLevels();
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.classList.add('hidden');
                if (gameState === 'loading') {
                    changeState('menu_main');
                }
            }
        }

        // Failsafe timer: Force entry to menu_main within 1.5s so user is never blocked
        setTimeout(() => {
            csvLoaded = true;
            checkReady();
        }, 1500);

        function parseCsvLine(line) {
            const row = [];
            let inQuotes = false;
            let token = "";
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i+1] === '"') { token += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(token.trim()); token = "";
                } else { token += char; }
            }
            row.push(token.trim());
            return row;
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pick(...args) { 
           if (Array.isArray(args[0])) return args[0][rand(0, args[0].length - 1)];
           return args[rand(0, args.length - 1)]; 
        }
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
        function sup(n) {
          const sups = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
          return String(n).split('').map(d => sups[d] || d).join('');
        }
        function repeatMul(num, count) { return Array(Math.max(1, count)).fill(num).join(' × '); }
        function repeatAdd(num, count) { return Array(Math.max(1, count)).fill(num).join(' + '); }

        // Fetch CSV from multiple candidate locations

        function tryLoadCsv(index = 0) {
            if (index >= csvCandidates.length) {
                console.warn("CSV not found, using built-in arithmetic DB.");
                ensureFallbackLevels();
                csvLoaded = true;
                checkReady();
                return;
            }
            fetch(csvCandidates[index] + '?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error("Status " + res.status);
                    return res.text();
                })
                .then(text => {
                    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                    const lines = text.split(/\r?\n/);
                    const lvlMap = new Map();
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = parseCsvLine(lines[i]);
                        if (cols.length < 5) continue;
                        
                        const lvl = parseInt(cols[0]);
                        if (lvl > 4) continue; 
                        const sub = parseInt(cols[1]);
                        
                        questionDB.push({
                            level: lvl, subLevel: sub,
                            lvlTitle: cols[2], subTitle: cols[3],
                            qTemp: cols[4], cTemp: cols[5], wTemp: cols[6],
                            va: cols[7], vb: cols[8], vc: cols[9], vd: cols[10] || "0"
                        });
                        
                        if (!lvlMap.has(lvl)) lvlMap.set(lvl, { id: lvl, title: cols[2], subLevels: [] });
                        const lObj = lvlMap.get(lvl);
                        if (!lObj.subLevels.some(s => s.id === sub)) {
                            lObj.subLevels.push({ id: sub, title: cols[3] });
                        }
                    }
                    dynamicLevels = Array.from(lvlMap.values()).sort((a,b)=>a.id-b.id);

        function createRawQuestion() {
            let candidates;
            if (currentLevel === 5) {

                candidates = questionDB.filter(q => q.level === currentLevel && q.subLevel === currentSubLevel);
            }
            if (candidates.length === 0) return { q: "2 + 3 = ?", c: "5", w: "6", template: "" };
            
            let t, A, B, C, D, q, c, w;
            let evalAttempts = 0;
            do {
                t = pick(candidates);
                A = 0; B = 0; C = 0; D = 0;
                const values = { A, B, C, D };
                try { A = QuestionEvaluator.evaluate(t.va, values); values.A = A; } catch(e){}
                try { B = QuestionEvaluator.evaluate(t.vb, values); values.B = B; } catch(e){}
                try { C = QuestionEvaluator.evaluate(t.vc, values); values.C = C; } catch(e){}
                try { D = QuestionEvaluator.evaluate(t.vd, values); values.D = D; } catch(e){}
                
                q = t.qTemp.replace(/\{A\}/g, A).replace(/\{B\}/g, B).replace(/\{C\}/g, C).replace(/\{D\}/g, D);
                q = q.replace(/\{([^}]+)\}/g, (m, expr) => { try { return QuestionEvaluator.evaluate(expr, values); } catch(e) { return m; } });
                
                c = ""; w = "";
                try { c = QuestionEvaluator.evaluate(t.cTemp, values); } catch(e){ c = "err"; }
                try { w = QuestionEvaluator.evaluate(t.wTemp, values); } catch(e){ w = "err"; }
                evalAttempts++;
            } while (c.toString() === w.toString() && evalAttempts < 10);
            
            if (c.toString() === w.toString()) {
                if (!isNaN(Number(c))) w = (Number(c) + 1).toString();
                else w = c.toString() + "'";
            }
            return { q: q.toString(), c: c.toString(), w: w.toString(), template: t.qTemp };

        class Particle {
            constructor(x, y, vx, vy, color, life, size) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = size;
            }
            update(dt) {
                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;
                this.life -= dt;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createShatterParticles(x, y) {

        function drawGuardian(ctx, timeMs) {
            if (!processedGuardianCanvas) return;
            ctx.save();
            const gW = width*0.35;
            const gH = gW * (processedGuardianCanvas.height / processedGuardianCanvas.width);
            const floatY = Math.sin(timeMs/500)*10;

        function updateVideoScale() {
            if (!videoElement || videoElement.videoWidth === 0) {

                return;
            }
            const vW = videoElement.videoWidth;
            const vH = videoElement.videoHeight;
            // Restore the full-canvas mirrored camera background.
            const scale = Math.max(width / vW, height / vH);
            videoScaleInfo = { dw: vW * scale, dh: vH * scale, cx: width / 2, cy: height / 2 };
        }

        function landmarkToScreen(lm) {
            if (!lm) return { x: 0, y: 0, vis: 0 };
            if (!videoScaleInfo.dw) updateVideoScale();
            const { dw, dh, cx, cy } = videoScaleInfo;
            // Mirrored horizontally:
            const sx = cx + (0.5 - lm.x) * dw;
            const sy = cy + (lm.y - 0.5) * dh;
            // A display crop must not invalidate joints still visible to the camera.
            const inFrame = Number.isFinite(sx) && Number.isFinite(sy) && lm.x >= 0 && lm.x <= 1 && lm.y >= 0 && lm.y <= 1;
            return { x: sx, y: sy, vis: inFrame ? (lm.visibility ?? 0) : 0 };

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setCameraStatus('카메라를 사용할 수 없습니다. Space와 방향키로 테스트할 수 있습니다.');
                return;
            }
            if (!pose) {
                setCameraStatus('자세 인식 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.');
                return;
            }
            cameraStarting = true;
            cameraReady = false;
            resetTracking();
            if (currentStream) stopCamera();

            videoElement.srcObject = null;
            setCameraStatus('카메라 권한 요청 중 · 허용을 눌러주세요');
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ audio: false,
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } } });
                videoElement.muted = true;
                videoElement.playsInline = true;
                videoElement.srcObject = currentStream;
                const haveMetadata = typeof HTMLMediaElement !== 'undefined' ? HTMLMediaElement.HAVE_METADATA : 1;
                if (videoElement.readyState < haveMetadata) await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Camera metadata timeout')), 5000);
                    videoElement.onloadedmetadata = () => { clearTimeout(timeout); resolve(); };
                    videoElement.onerror = () => { clearTimeout(timeout); reject(new Error('Video element error')); };
                });
                await videoElement.play();
                cameraReady = true;
                poseFailed = false;
                lastVideoTime = -1;
                lastHandsVideoTime = -1;
                poseMissCount = 0;
                poseFramesReceived = 0;
                poseFramesWithBody = 0;
                poseLastSentAt = 0;
                lastPoseTimestamp = performance.now();
                setCameraStatus('카메라 연결됨 · 몸을 화면에 맞춰주세요', false);
            } catch (e) {
                stopCamera();
                const reason = e.name === 'NotAllowedError' ? '브라우저에서 카메라를 허용한 뒤 새로고침하세요. 키보드 테스트는 가능합니다.' :
                    e.name === 'NotFoundError' ? '사용할 수 있는 카메라를 찾지 못했습니다.' :
                    '카메라를 시작하지 못했습니다. 다른 카메라 앱을 닫고 다시 시작하세요.';
                setCameraStatus(reason);
            } finally {
                cameraStarting = false;
            }
        }

        let prevMotionData = null;

        function processMotion(landmarks, dt) {
            if (!['ready_position', 'running', 'playing'].includes(gameState)) return;
            if (![11,12].every(i => landmarks[i] && landmarks[i].visibility >= 0.6)) {
                resetTracking(); return;
            }
            const shoulderL = landmarks[11];
            const shoulderR = landmarks[12];
            const wristL = landmarks[15];
            const wristR = landmarks[16];
            
            const currentShoulderY = (shoulderL.y + shoulderR.y) / 2;
            const shoulderMidX = (shoulderL.x + shoulderR.x) / 2;

            if (gameState === 'playing') {
                const points = landmarks.map(landmarkToScreen);
                const result = answerGate.update(points, dt, questionReadinessTimer > 0, targetOptions,getFreshPalmPoints());
                poseFeedback = result.hint;
                if (result.choice) handleAnswer(result.choice, 'pose');
                return;
            }

            // Adaptive baseline shoulder height when standing neutral
            if (gameState !== 'ready_position' && Math.abs(currentShoulderY - baseShoulderY) < 0.04) {
                baseShoulderY = baseShoulderY * 0.98 + currentShoulderY * 0.02;
            }

            // 1. Squat Detection (Ring-Fit Style Defense)
            const squatDepth = currentShoulderY - baseShoulderY;
            if (squatDepth > 0.065) {
                isSquatting = true;
                if (!wasSquatting) {
                    wasSquatting = true;
                    totalSquats++;
                    playSound('shield_deflect');
                    if (bossAttackActive) {
                        bossAttackDeflected = true;
                        bossAttackActive = false;
                        score += 150;
                        createShatterParticles(width / 2, height * 0.45);
                    }
                }
            } else if (squatDepth < 0.035) {
                isSquatting = false;
                wasSquatting = false;
            }

            // 2. Jump Detection (Ring-Fit Style Power Leap)
            if (jumpCooldown > 0) jumpCooldown -= dt;
            const jumpDelta = baseShoulderY - currentShoulderY;
            if (jumpDelta > 0.065 && jumpCooldown <= 0 && prevMotionData && (prevMotionData.shoulderMidY - currentShoulderY) / dt > 0.22) {
                isJumping = true;
                wasJumping = true;
                jumpCooldown = 0.8;
                totalJumps++;
                playSound('jump_whoosh');
                if (gameState === 'running') runGauge = Math.min(100, runGauge + 25);
                if (gameState === 'playing') score += 100;
            } else if (jumpDelta < 0.03) {
                isJumping = false;
                wasJumping = false;
            }

            // 3. Ready Position Calibration
            if (gameState === 'ready_position') {
                const noseP = landmarkToScreen(landmarks[0]);
                const bx = width * 0.15;
                const by = height * 0.18;
                const bw = width * 0.7;
                const bh = height * 0.55;
                const inBox = (noseP.vis > 0.3 && noseP.x > bx && noseP.x < bx + bw && noseP.y > by && noseP.y < by + bh);
                if (inBox) {
                    baseShoulderY = currentShoulderY;
                    runGauge += dt * 1.6;
                    if (runGauge > 2.0) {
                        playSound('start');
                        changeState('running');
                    }
                } else {
                    runGauge = Math.max(0, runGauge - dt);
                }
                return;
            }

            // 4. Running Motion
            if (gameState === 'running') {
                runStepTimer += dt;
                if (prevMotionData) {
                    const dS_LR = Math.abs(shoulderMidX - prevMotionData.shoulderMidX);
                    const dS_UD = Math.abs(currentShoulderY - prevMotionData.shoulderMidY);
                    const crossDist = wristL.x - wristR.x;
                    const dCross = Math.abs(crossDist - prevMotionData.crossDist);

                    // Running step cycle count
                    if (dS_UD > 0.012 && runStepTimer > 0.2) {
                        totalSteps++;
                        runStepTimer = 0;
                        playSound('step_beat');
                    }
                    
                    let rawMotion = 0;
                    if (dS_LR > 0.010) rawMotion += dS_LR;
                    if (dS_UD > 0.010) rawMotion += dS_UD;
                    if (dCross > 0.015) rawMotion += dCross * 0.5;
                    
                    const filtered = Math.max(0, rawMotion - 0.007);
                    runGauge += Math.min(1.5, filtered * 100);
                }
                
            }

            prevMotionData = {
                shoulderMidX, 
                shoulderMidY: currentShoulderY, 
                crossDist: wristL.x - wristR.x
            };
        }

        function generateNewQuestion() {
            questionPanelDirty = true;
            questionReader.cancel();
            questionSpeaking = false;
            questionSpeechPending = true;
            answerGate.reset();
            poseFeedback = '문제를 읽고 · 두 팔 내리고 · 바로 서세요';
            questionData = createRawQuestion();
            questionReadinessTimer = 2.0;
            playSound('start');
            const isFirstCorrect = Math.random() > 0.5;

            targetOptions = AnswerSelection.choices(questionData);

            // A defensive squat must not accidentally select the squat answer.
            bossAttackActive = false;
        }

        function handleAnswer(choice, source = 'manual') {
            if (gameState !== 'playing' || questionPanelDirty || questionReadinessTimer > 0 || !targetOptions.includes(choice)) return;
            if (source === 'pose' && (!choice.isFullBody || choice.dwell < 1 || performance.now() - lastValidPoseTime > MotionInput.MAX_FRAME_GAP * 1000)) return;
            questionCount++;
            bossAttackActive = false; // clear attack on question answer

            const isCorrect = (typeof choice === 'object') ? choice.isCorrect : (choice === correctSide);
            const isFullBody = source === 'pose' && !!choice.isFullBody;

            if (isCorrect) {
                playSound('correct');
                guardianMana = Math.min(SPELL_COST, guardianMana + MANA_PER_ANSWER);
                totalManaDelivered += MANA_PER_ANSWER;
                correctCount++;
                currentCombo++;
                maxCombo = Math.max(maxCombo, currentCombo);
                const fullBodyBonus = isFullBody ? 100 : 0;
                score += (100 * currentCombo) + fullBodyBonus;
                changeState('correct');
            } else {
                playSound('wrong');
                playSound('player_hurt');
                currentCombo = 0;
                playerHp -= 25;
                playerHurtTimer = 0.5;
                document.getElementById('container').classList.add('shake');
                setTimeout(()=>document.getElementById('container').classList.remove('shake'), 400);
                changeState('wrong');
                
            }
        }

        function updateRunningProgress(dt) {
            if (gameState !== 'running') return;
            // Check BEFORE decay, independently of camera callbacks and input source.
            if (runGauge >= 100) {
                runGauge = 0;
                generateNewQuestion();
                changeState('playing');
                return;
            }
            runGauge = Math.max(0, runGauge - 15 * dt);
        }

        function updateGuardianBattle() {
            if (gameState === 'correct' && stateTimer >= 1.5) {
                if (guardianMana >= SPELL_COST) {
                    guardianMana -= SPELL_COST;
                    spellsCast++;
                    spellImpactDone = false;
                    playSound('start');
                    changeState('guardian_cast');
                } else changeState('running');
            } else if (gameState === 'wrong' && stateTimer >= 1.5) {
                changeState(playerHp <= 0 ? 'gameover' : 'running');
            } else if (gameState === 'guardian_cast') {
                if (!spellImpactDone && stateTimer >= 0.8) {
                    spellImpactDone = true;
                    bossHp = Math.max(0, bossHp - SPELL_DAMAGE);
                    bossHurtTimer = 0.6;
                    playSound('monster_hit');
                    createShatterParticles(width/2, height*0.25);
                }
                if (stateTimer >= 1.8) {
                    if (bossHp <= 0) {
                        clearTimeMs = Date.now() - gameStartTime;
                        changeState(currentLevel === 5 ? 'ending_cutscene' : 'result');
                    } else changeState('running');
                }
            }
        }

        function updateBossAttack(dt) {
            if (!['running', 'ready_position'].includes(gameState) || bossAttackActive) return;
            bossAttackCooldown -= dt;
            if (bossAttackCooldown <= 0) {
                bossAttackActive = true;
                bossAttackDeflected = false;
                bossAttackTimer = 2.5;
                bossAttackCooldown = 9 + Math.random() * 4;
                playSound('warning');
            }
        }

        function changeState(newState) {
            if (newState !== 'playing') {
                questionSpeechRequest++;
                questionReader.cancel();
                questionSpeaking = false;
                questionSpeechPending = false;
            }
            gameState = newState;
            stateTimer = 0;
            if (newState === 'running') runGauge = 0;
            if (newState === 'result') {
                unlockedChapter = Math.max(unlockedChapter, Math.min(5, currentLevel + 1));
                try { localStorage.setItem('dream_guardian_progress', String(unlockedChapter)); } catch (_) {}
                resultPopupTimer = 3;
            }
            if (newState === 'story_intro') {
                storyTexts = STORY_DATA[currentLevel].split('...');
            }
            if (newState === 'result' || newState === 'gameover' || newState === 'ending_cutscene') {
                stopBGM();
            }
            if (newState === 'menu_main' || newState === 'result' || newState === 'gameover' || newState === 'ending_cutscene') stopCamera();
        }

        // ==========================================
        // 6. Game Loop & Main Rendering
        // ==========================================
        let lastTimestamp = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                width = Math.round(rect.width);
                height = Math.round(rect.height);
                if (canvas.width !== width || canvas.height !== height) {
                    canvas.width = width;
                    canvas.height = height;
                    updateVideoScale();
                    answerGate.reset();
                    if (gameState === 'playing') questionPanelDirty = true;
                }
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
            if (gameState === 'playing') questionPanelDirty = true;
        });

        let renderFailureCount = 0;

        function reportRenderFailure(error) {
            renderFailureCount++;
            console.error('Dream Guardian frame recovered:', error);
            const status = document.getElementById('camera_status');
            if (status) {
                status.textContent = `화면 오류를 복구 중입니다 (${renderFailureCount})`;
                status.hidden = false;
            }
        }

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000.0);
            lastTimestamp = timestamp;
            const timeMs = Date.now();

            // Schedule first: an isolated draw/audio exception can never stop the game loop.
            requestAnimationFrame(gameLoop);

            try {
            if (gamePaused) {
                drawScene(timeMs, 0);
                return;
            }

            stateTimer += dt;
            if (resultPopupTimer > 0) {
                resultPopupTimer -= dt;
                if (resultPopupTimer <= 0) { showRecordsModal(); resultPopupTimer = 0; }
            }
            updateGuardianBattle();
            updateBossAttack(dt);
            if (bossHurtTimer > 0) bossHurtTimer -= dt;
            if (playerHurtTimer > 0) playerHurtTimer -= dt;

            // Question Reading Freeze Timer
            if (gameState === 'playing' && questionReadinessTimer > 0) {
                questionReadinessTimer -= dt;
            }

            updateRunningProgress(dt);

            // Boss Attack Hazard Timer
            if (bossAttackActive) {
                bossAttackTimer -= dt;
                if (bossAttackTimer <= 0) {
                    bossAttackActive = false;
                    if (!bossAttackDeflected) {
                        playerHp -= 15;
                        currentCombo = 0;
                        playSound('player_hurt');
                        document.getElementById('container').classList.add('shake');
                        setTimeout(() => document.getElementById('container').classList.remove('shake'), 400);
                        if (playerHp <= 0) {
                            setTimeout(() => changeState('gameover'), 800);
                        }
                    }
                }
            }

            // Calorie burn tracking
            caloriesBurned = (totalSteps * 0.04) + (totalSquats * 0.35) + (totalJumps * 0.15);

            // Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Continuously stream video frames to MediaPipe Pose
            if (currentSkeletonLandmarks && performance.now() - lastValidPoseTime > 3000) resetTracking();
            if (pose && cameraReady && !cameraStarting && !poseFailed && !document.hidden && videoElement.readyState >= 2 && !isPoseSending && videoElement.currentTime !== lastVideoTime && performance.now()-poseLastSentAt>33) {
                lastVideoTime = videoElement.currentTime;
                poseLastSentAt = performance.now();
                isPoseSending = true;
                pose.send({ image: videoElement }).catch(e => {
                    console.warn(e);
                    poseMissCount++;
                    setCameraStatus('자세 모델 오류 · 인터넷 연결과 카메라 권한을 확인하세요.', false);
                }).finally(() => {
                    isPoseSending = false;
                });
            }
            if (hands && cameraReady && !cameraStarting && !document.hidden && videoElement.readyState >= 2 && !isHandsSending && videoElement.currentTime !== lastHandsVideoTime && performance.now()-lastHandsSendAt>33) {
                lastHandsVideoTime=videoElement.currentTime;
                lastHandsSendAt=performance.now();
                isHandsSending=true;
                hands.send({image:videoElement}).catch(e=>console.warn('Hand tracking error:',e)).finally(()=>{isHandsSending=false;});
            }

            drawScene(timeMs, dt);
            } catch (error) {
                reportRenderFailure(error);
            }
        }

        function drawScene(timeMs, dt) {
            syncQuestionPanel();
            ctx.clearRect(0, 0, width, height);

            // Menus need the same live camera coordinate system as gameplay.
            drawCameraViewport();

            // Always draw skeleton when available so player sees tracking in menus and gameplay!
            if (currentSkeletonLandmarks && ['menu_main','menu_sub'].includes(gameState)) {
                drawPoseSkeleton(ctx, currentSkeletonLandmarks, timeMs);
            }

            if (gameState === 'menu_main') {
                document.getElementById('game_controls').classList.remove('visible');
                drawMenuMain(timeMs, dt);
                drawMenuHandCursor();
                return;
            } else if (gameState === 'menu_sub') {
                document.getElementById('game_controls').classList.remove('visible');
                drawMenuSub(timeMs, dt);
                drawMenuHandCursor();
                return;
            } else if (gameState === 'story_intro') {
                document.getElementById('game_controls').classList.remove('visible');
                drawStoryIntro();
                if (stateTimer >= 3.0) startGameplay();
                return;
            } else if (gameState === 'result') {
                document.getElementById('game_controls').classList.remove('visible');
                drawResult();
                return;
            } else if (gameState === 'gameover') {
                document.getElementById('game_controls').classList.remove('visible');
                drawGameover();
                return;
            } else if (gameState === 'ending_cutscene') {
                document.getElementById('game_controls').classList.remove('visible');
                drawEndingCutscene(ctx, timeMs);
                return;
            }

            document.getElementById('game_controls').classList.add('visible');
            document.getElementById('control_hud').textContent = `마나 ${guardianMana}/100 · HP ${playerHp} · 적 ${bossHp}/${bossMaxHp} · ${score}점`;

            // Gameplay State Background Grid
            drawDreamGrid(timeMs);

            // Running track orbs & light spirits
            if (gameState === 'running') {
                updateAndDrawTrackOrbs(ctx, dt, timeMs);
                drawSpirits(ctx, timeMs);
            }
            
            // Draw Street Fighter Style Top Duel HUD (Player Left, Boss Right, VS Center)
            if (['ready_position', 'running', 'playing', 'correct', 'wrong', 'guardian_cast'].includes(gameState)) {
                drawBoss(ctx, timeMs);
                drawStreetFighterHUD();
            }

            // Draw Guardian
            drawGuardian(ctx, timeMs);

            // Draw Aegis Shield if player is squatting
            if (isSquatting) {
                drawShield(ctx, timeMs);
            }

            // Draw Skeleton & Wrist Magic Rings for Pose Feedback
            drawPoseSkeleton(ctx, currentSkeletonLandmarks, timeMs);

            // UI Overlays
            if (gameState === 'ready_position') {
                drawCalibrationGuide(ctx);
                drawText("몸을 화면 중앙에 맞추고 자세를 유지하세요", width/2, height*0.13, '#a8e6f0', 18);
                drawManaFlask(width/2, height*0.62, runGauge / 2.0);
            } else if (gameState === 'running') {
                let encourage = "달려서 다음 사고의 빛을 찾아요!";
                if (runGauge > 70) encourage = "수호신과 함께 앞으로!";
                else if (runGauge > 40) encourage = "수호신과 함께 앞으로!";
                drawText(encourage, width/2, height*0.4, '#e0f0ff', 20);
                drawText('다음 사고의 빛을 찾는 중', width/2, height*0.58, '#fff', 18);
            } else if (gameState === 'playing' && questionData && targetOptions && targetOptions.length >= 2) {
                // Boss hazard sweep warning if active
                if (bossAttackActive) {
                    drawBossAttackWave(ctx, timeMs);
                }

                drawZoneAnswers();
            } else if (gameState === 'correct') {
                drawText('정답! 마나 +25', width/2, height*0.45, '#a8e6f0', 32);
                drawText('수호신에게 사고의 빛을 전달했어요', width/2, height*0.51, '#fff', 18);
                const progress = Math.min(1, stateTimer / 1.2);
                ctx.save();
                ctx.fillStyle = '#a8e6f0'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20;
                for (let i=0; i<5; i++) {
                    ctx.beginPath();
                    ctx.arc(width/2 + Math.sin(progress*Math.PI*2+i)*width*0.1*(1-progress), height*(0.53+progress*0.24), 5, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            } else if (gameState === 'guardian_cast') {
                drawText('수호신 마법 · 사고의 별!', width/2, height*0.49, '#ffd700', 27);
                const progress = Math.min(1, stateTimer / 0.8);
                ctx.save();
                ctx.fillStyle = '#fff'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 25;
                ctx.beginPath(); ctx.arc(width/2, height*(0.78-progress*0.53), 14, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            } else if (gameState === 'wrong') {
                drawText('수호신이 공격을 막았어요', width/2, height*0.46, '#ff88aa', 25);
                drawText('마나는 그대로! 다음 문제에서 다시 모아요', width/2, height*0.52, '#fff', 17);
            }

            if (gameState === 'playing') {
                ctx.fillStyle = '#080d23';
                ctx.fillRect(0, height * 0.855, width, height * 0.045);
                drawText(cameraReady && !poseFailed ? poseFeedback : 'PC 테스트: Space 달리기 · 1/2 또는 답 구역 클릭', width/2, height * 0.878, '#fff', Math.min(18, width/22));
            }
            const gaugeX=width*.22,gaugeY=height*.825,gaugeW=width*.56;
            if (gameState==='running') {
                ctx.fillStyle='rgba(7,12,30,.9)';ctx.fillRect(gaugeX,gaugeY,gaugeW,12);
                ctx.strokeStyle=runGauge>=75?'#339cff':'#ff8a24';ctx.lineWidth=2;ctx.strokeRect(gaugeX,gaugeY,gaugeW,12);
                ctx.fillStyle=runGauge>=75?'#339cff':'#ff8a24';ctx.fillRect(gaugeX,gaugeY,gaugeW*runGauge/100,12);
                drawText(`달리기 ${Math.floor(runGauge)}%`,width/2,gaugeY-12,'#fff',14);
            } else {
                ctx.fillStyle = '#080d23'; ctx.fillRect(gaugeX,gaugeY,gaugeW,12);
                ctx.fillStyle = '#00e5ff'; ctx.fillRect(gaugeX,gaugeY,gaugeW*guardianMana/SPELL_COST,12);
                drawText(`수호신 마나 ${guardianMana}/100 · 정답 4개 → 마법`,width/2,gaugeY-12,'#fff',13);
            }

            // Draw Particles
            particles.forEach(p => p.draw(ctx));
        }

        function drawCameraViewport() {
            if (!cameraReady || videoElement.videoWidth <= 0) return;
            updateVideoScale();
            const {dw,dh,cx,cy} = videoScaleInfo;
            ctx.save();ctx.translate(cx,cy);ctx.scale(-1,1);
            ctx.drawImage(videoElement,-dw/2,-dh/2,dw,dh);
            ctx.fillStyle='rgba(10,14,26,.35)';ctx.fillRect(-dw/2,-dh/2,dw,dh);
            ctx.restore();
        }

        function drawPartMarker(part, x, y, size, label = '') {
            const style = AnswerSelection.CURSORS[part] || ZoneInput.PARTS[part];
            // Active cursor icons are enlarged relative to the old 1x renderer, then tuned
            // down 30% from the previous 2x pass.
            const r = size * 1.4;
            const now = Date.now();
            // Only the pelvis restores the original stronger breathing setting.
            const breath = part === 'hip'
                ? 1 + Math.sin(now / 170) * 0.22
                : 1 + Math.sin(now / 250) * 0.08;
            // Keep the existing timing, but reduce the visual blow strength by half.
            const blow = 1 + ((now % 1450) / 1450) * 0.325;
            const trail = markerTrail[part] || [];

            ctx.save();
            ctx.globalAlpha = part === 'face' ? .5 : 1;
            ctx.shadowColor=style.color;
            ctx.shadowBlur=10;
            ctx.strokeStyle = style.color;

            // Strong expanding breathing ring: each outer ring grows and fades.
            ctx.save();
            ctx.globalAlpha *= Math.max(0, .14 * (1.8 - blow));
            ctx.lineWidth = 2;
            ctx.beginPath();ctx.arc(x,y,r*blow,0,Math.PI*2);ctx.stroke();
            ctx.restore();

            // Draw actual recent positions. The former single-point extrapolation was often
            // hidden under the cursor; retaining three samples makes the intended trail visible.
            trail.slice(0, 3).forEach((point, index) => {
                ctx.save();
                ctx.globalAlpha *= [0.42, 0.26, 0.14][index];
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                drawMarkerPath(ctx, style, point.x, point.y, r * breath * (1 - (index + 1) * 0.13));
                ctx.stroke();
                ctx.restore();
            });
            markerTrail[part] = [{ x, y }, ...trail].slice(0, 3);

            ctx.lineWidth = 5;
            ctx.beginPath();
            drawMarkerPath(ctx,style,x,y,r*breath);
            ctx.stroke();
            if(part==='leftHand'||part==='rightHand') {
                ctx.save();ctx.globalAlpha*=.55;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.42,0,Math.PI*2);ctx.stroke();ctx.restore();
            }
            if (label) drawText(label,x,y,style.color,14);
            ctx.restore();
        }

        function drawMarkerPath(context, style, x, y, r) {
            if (style.shape === 'ellipse') {
                context.ellipse(x,y,r*.82,r*1.08,0,0,Math.PI*2);
            } else if (style.shape === 'diamond') {
                // Current diamond -> half its height -> whole result at 70%.
                // Width: .70 * .70r = .49r. Height: .50 * .70 * .35r = .1225r.
                const rx=r*.49,ry=r*.1225;
                context.moveTo(x,y-ry);context.lineTo(x+rx,y);context.lineTo(x,y+ry);context.lineTo(x-rx,y);context.closePath();
            } else if (style.shape === 'rect') {
                if (context.roundRect) context.roundRect(x-r,y-r*.72,r*2,r*1.44,r*.34);
                else context.rect(x-r,y-r*.72,r*2,r*1.44);
            } else {
                context.arc(x,y,r,0,Math.PI*2);
            }
        }

        function palmOrWrist(part, fallback) {
            const palm=palmPoints[part];
            return palm && palm.vis>=.55 && performance.now()-palm.receivedAt<=PALM_MAX_AGE_MS ? palm : fallback;
        }

        function getFreshPalmPoints() {
            const now=performance.now();
            return {
                leftHand:palmPoints.leftHand && now-palmPoints.leftHand.receivedAt<=PALM_MAX_AGE_MS ? palmPoints.leftHand : null,
                rightHand:palmPoints.rightHand && now-palmPoints.rightHand.receivedAt<=PALM_MAX_AGE_MS ? palmPoints.rightHand : null
            };
        }

        function drawZoneAnswers() {
            if(!targetOptions.length)return;
            const b=AnswerSelection.board(width,height);
            const requiredParts=[...new Set(targetOptions.flatMap(option=>option.requirements.map(req=>req.part)))];
            ctx.save();
            AnswerSelection.ZONES.forEach(z=>{
                const r=AnswerSelection.rect(z.id,width,height);
                const owners=targetOptions.flatMap((option,index)=>option.activeZoneIds.includes(z.id)
                    ? option.requirements.filter(req=>AnswerSelection.canPartUseZone(req.part,z.id)).map(req=>({option,index,req})) : []);
                ctx.fillStyle=owners.length?'#101d32e8':'#09122150';
                ctx.strokeStyle=owners.length?AnswerSelection.CURSORS[owners[0].req.part].color:'#72829b55';
                ctx.lineWidth=owners.length?3:1;
                ctx.fillRect(r.x+2,r.y+2,r.w-4,r.h-4);ctx.strokeRect(r.x+2,r.y+2,r.w-4,r.h-4);
                if(owners.length){
                    const partOwners=[...new Map(owners.map(owner=>[owner.req.part,owner])).values()];
                    partOwners.forEach((owner,i)=>{
                        const color=AnswerSelection.CURSORS[owner.req.part].color;
                        const segmentW=(r.w-8)/partOwners.length;
                        ctx.fillStyle=color;ctx.globalAlpha=.22;ctx.fillRect(r.x+4+i*segmentW,r.y+4,segmentW,r.h-8);ctx.globalAlpha=1;
                        drawText(AnswerSelection.CURSORS[owner.req.part].label,r.x+4+(i+.5)*segmentW,r.y+r.h/2,color,12);
                    });
                    drawZonePulse(r,owners[0].req.part);
                } else drawText(z.label,r.x+r.w/2,r.y+r.h/2,'#9aa6ba',11);
            });
            targetOptions.forEach((option,index)=>{
                const x=index===0?width*.18:width*.82,y=height*.445,r=width*.13;
                ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
                option.requirements.forEach((req,i)=>{ctx.fillStyle=AnswerSelection.CURSORS[req.part].color;ctx.fillRect(x-r+i*(2*r/option.requirements.length),y-r,2*r/option.requirements.length,2*r);});
                ctx.restore();ctx.strokeStyle='#d9f8ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
                drawText(option.text,x,y,'#fff',32);
                drawText(`${index+1} · ${option.requirements.map(r=>AnswerSelection.CURSORS[r.part].label).join('+')}`,x,y+r+15,'#fff',12);
            });
            const controls=answerGate.controls||{};
            // One virtual cursor per required body part. It remains one cursor even when that
            // color appears in both answer choices; all unrelated body cursors stay hidden.
            requiredParts.forEach(part=>{
                const p=controls[part];
                if(!p||p.vis<.55)return;
                drawPartMarker(part,b.x+p.x*b.w,b.y+p.y*b.h,part==='hip'?14:10);
            });
            drawText(questionReadinessTimer>0?'문제 확인':answerGate.baseline?'가상 이동 커서를 해당 칸에 유지':'가운데에서 기준 자세 준비',width/2,b.y+b.h*.42,'#fff',16);
            drawText('1초 유지',width/2,b.y+b.h*.52,'#fff',14);
            ctx.restore();
        }

        function drawZonePulse(rect, part) {
            const color=AnswerSelection.CURSORS[part].color;
            const cx=rect.x+rect.w/2,cy=rect.y+rect.h/2;
            const max=Math.min(rect.w,rect.h)*.48;
            const phase=(Date.now()%1200)/1200;
            const engaged=(answerGate.engagedZoneIds||[]).includes(AnswerSelection.ZONES.find(z=>AnswerSelection.rect(z.id,width,height).x===rect.x&&AnswerSelection.rect(z.id,width,height).y===rect.y)?.id);
            ctx.save();ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=engaged?18:10;ctx.lineWidth=engaged?5:3;
            // Inner humming rings and an outer expanding/fading ring.
            for(let i=0;i<2;i++){
                const p=(phase+i*.5)%1;
                ctx.globalAlpha=(1-p)*(engaged?1:.7);
                ctx.beginPath();ctx.arc(cx,cy,max*(.25+p*.9),0,Math.PI*2);ctx.stroke();
            }
            ctx.restore();
        }

        function interactionCursor() {
            if (!currentSkeletonLandmarks) return null;
            const points=currentSkeletonLandmarks.map(landmarkToScreen);
            return MenuInput.joinedCursor(points);
        }

        function drawMenuHandCursor() {
            if (!['menu_main','menu_sub'].includes(gameState)) return;
            const p=interactionCursor();
            if (!p || p.vis<0.65) return;
            // Draw after the menu cards: the joined-hands menu cursor is always on top.
            ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
            ctx.shadowColor='#28E6FF';ctx.shadowBlur=16;ctx.fillStyle='#071025';ctx.strokeStyle='#28E6FF';ctx.lineWidth=4;
            ctx.beginPath();ctx.arc(p.x,p.y,27,0,Math.PI*2);ctx.fill();ctx.stroke();
            ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(p.x,p.y,36+Math.sin(Date.now()/120)*3,0,Math.PI*2);ctx.stroke();
            ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('손 모으기',p.x,p.y);
            ctx.restore();
        }

        // ==========================================
        // 7. Visual Feedback & Exercise Rendering
        // ==========================================
        function drawPoseSkeleton(ctx, landmarks, timeMs) {
            if (!landmarks || landmarks.length < 17) return;

            const sL = landmarkToScreen(landmarks[11]), sR = landmarkToScreen(landmarks[12]);
            const eL = landmarkToScreen(landmarks[13]), eR = landmarkToScreen(landmarks[14]);
            const wL = landmarkToScreen(landmarks[15]), wR = landmarkToScreen(landmarks[16]);
            const hL = landmarkToScreen(landmarks[23]), hR = landmarkToScreen(landmarks[24]);

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Bone lines with glow
            ctx.globalAlpha = 1;
            ctx.strokeStyle = isSquatting ? 'rgba(0, 255, 180, 0.1)' : 'rgba(0, 229, 255, 0.1)';
            ctx.lineWidth = 3.5;
            ctx.shadowBlur = 0;

            const drawLine = (p1, p2) => {
                if (p1.vis > 0.4 && p2.vis > 0.4) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            };

            // Upper body skeleton
            drawLine(sL, sR);
            drawLine(sL, eL); drawLine(eL, wL);
            drawLine(sR, eR); drawLine(eR, wR);
            drawLine(sL, hL); drawLine(sR, hR); drawLine(hL, hR);
            const head = landmarkToScreen(landmarks[0]);
            const neck = {x:(sL.x+sR.x)/2,y:(sL.y+sR.y)/2,vis:Math.min(sL.vis,sR.vis)};
            drawLine(head, neck);

            // Legs if in frame
            if (landmarks.length > 28) {
                const kL = landmarkToScreen(landmarks[25]), kR = landmarkToScreen(landmarks[26]);
                const aL = landmarkToScreen(landmarks[27]), aR = landmarkToScreen(landmarks[28]);
                drawLine(hL, kL); drawLine(kL, aL);
                drawLine(hR, kR); drawLine(kR, aR);
            }

            // Neutral joints are deliberately subtle. During an answer, color cursors are
            // rendered only once in the fitness-zone board, never again on the body video.
            const joints = [eL, eR, ...[25,26,27,28].map(i => landmarkToScreen(landmarks[i]))];
            ctx.fillStyle = '#e0f0ff';
            joints.forEach(j => {
                if (j.vis > 0.4) {
                    ctx.beginPath();
                    ctx.arc(j.x, j.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            if (gameState !== 'playing') {
                if (head.vis >= 0.6) drawPartMarker('face',head.x,head.y,Math.max(14,Math.min(42,Math.abs(sL.x-sR.x)*0.42)));
                [sL,sR].forEach(p=>{if(p.vis>=.6)drawPartMarker('shoulder',p.x,p.y,12);});
                if(hL.vis>=.6&&hR.vis>=.6)drawPartMarker('hip',(hL.x+hR.x)/2,(hL.y+hR.y)/2,Math.max(10,Math.hypot(hL.x-hR.x,hL.y-hR.y)*.6));
                const leftPalm=palmOrWrist('leftHand',wL),rightPalm=palmOrWrist('rightHand',wR);
                if(leftPalm.vis>=.6)drawPartMarker('leftHand',leftPalm.x,leftPalm.y,14);
                if(rightPalm.vis>=.6)drawPartMarker('rightHand',rightPalm.x,rightPalm.y,14);
            }

            ctx.restore();
        }

        function drawShield(ctx, timeMs) {
            ctx.save();
            const cx = width / 2;
            const cy = height * 0.78;
            const r = width * 0.44;

            // Outer glow dome
            ctx.beginPath();
            ctx.arc(cx, cy, r, Math.PI * 0.85, Math.PI * 2.15);
            ctx.strokeStyle = 'rgba(0, 255, 220, 0.85)';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00ffd0';
            ctx.shadowBlur = 20;
            ctx.stroke();

            // Translucent dome fill
            const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
            grad.addColorStop(0, 'rgba(0, 229, 255, 0.05)');
            grad.addColorStop(1, 'rgba(0, 255, 200, 0.22)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Rotating hexagon rune
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(timeMs / 800);
            ctx.strokeStyle = 'rgba(168, 255, 240, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const hx = Math.cos(angle) * (r * 0.6);
                const hy = Math.sin(angle) * (r * 0.6);
                if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
            }
            ctx.closePath(); ctx.stroke();
            ctx.restore();

            drawText("🛡️ 수호 결계 전개! (SQUAT DEFENSE)", cx, cy - r - 15, '#00ffd0', 16);
            ctx.restore();
        }

        function drawCalibrationGuide(ctx) {
            const bx = width * 0.15;
            const by = height * 0.18;
            const bw = width * 0.7;
            const bh = height * 0.55;

            ctx.save();
            const isAligned = runGauge > 0.3;
            ctx.strokeStyle = isAligned ? 'rgba(0, 255, 180, 0.8)' : 'rgba(0, 229, 255, 0.5)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([14, 10]);
            ctx.shadowColor = isAligned ? '#00ffb4' : '#00e5ff';
            ctx.shadowBlur = 12;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.setLineDash([]);

            const cLen = 22;
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(bx, by + cLen); ctx.lineTo(bx, by); ctx.lineTo(bx + cLen, by); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx + bw - cLen, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + cLen); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx, by + bh - cLen); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + cLen, by + bh); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx + bw - cLen, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - cLen); ctx.stroke();

            ctx.restore();
        }

        function drawSpirits(ctx, timeMs) {
            ctx.save();
            const s1x = width * 0.28 + Math.sin(timeMs / 300) * 16;
            const s1y = height * 0.82 + Math.cos(timeMs / 250) * 10;
            const s2x = width * 0.72 + Math.cos(timeMs / 300) * 16;
            const s2y = height * 0.82 + Math.sin(timeMs / 250) * 10;

            const drawWisp = (x, y, color) => {
                ctx.fillStyle = color;
                ctx.shadowColor = color; ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x - 5, y); ctx.lineTo(x - 12, y - 6);
                ctx.moveTo(x + 5, y); ctx.lineTo(x + 12, y - 6);
                ctx.stroke();
            };

            drawWisp(s1x, s1y, '#00e5ff');
            drawWisp(s2x, s2y, '#ffd700');
            ctx.restore();
        }

        function updateAndDrawTrackOrbs(ctx, dt, timeMs) {
            trackOrbSpawnTimer += dt;
            if (trackOrbSpawnTimer > 1.2) {
                trackOrbSpawnTimer = 0;
                trackOrbs.push({
                    lane: (Math.random() - 0.5) * 0.65,
                    z: 1.0,
                    val: rand(1, 9)
                });
            }

            const speed = 0.55 + (runGauge / 100) * 1.3;
            const vanishingY = height * 0.35;

            for (let i = trackOrbs.length - 1; i >= 0; i--) {
                const orb = trackOrbs[i];
                orb.z -= dt * speed;

                if (orb.z <= 0.12 && orb.z >= -0.05) {
                    playSound('crystal_pickup');
                    score += 20;
                    runGauge = Math.min(100, runGauge + 6);
                    createShatterParticles(width / 2 + orb.lane * width, height * 0.75);
                    trackOrbs.splice(i, 1);
                    continue;
                } else if (orb.z < -0.05) {
                    trackOrbs.splice(i, 1);
                    continue;
                }

                const sy = vanishingY + (height - vanishingY) * Math.pow(orb.z, 2.5);
                const sx = width / 2 + orb.lane * width * (sy / height);
                const r = (1.0 - orb.z) * 14 + 5;

                ctx.save();
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#050308';
                ctx.font = `bold ${Math.max(9, Math.floor(r * 0.9))}px 'Gowun Batang', serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(orb.val, sx, sy);
                ctx.restore();
            }
        }

        function drawBossAttackWave(ctx, timeMs) {
            if (!bossAttackActive) return;
            const cy = height * 0.45;

            ctx.save();
            ctx.fillStyle = 'rgba(200, 0, 40, 0.85)';
            ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 2;
            ctx.fillRect(width * 0.05, cy - 45, width * 0.9, 32);

            ctx.strokeStyle = 'rgba(255, 0, 50, 0.9)';
            ctx.lineWidth = 5 + Math.sin(timeMs / 100) * 2;
            ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(width, cy);
            ctx.stroke();
            ctx.restore();
        }

        function drawEndingCutscene(ctx, timeMs) {
            ctx.save();
            const dawnGrad = ctx.createLinearGradient(0, 0, 0, height);
            dawnGrad.addColorStop(0, '#0a0d24');
            dawnGrad.addColorStop(0.5, '#1e1b4b');
            dawnGrad.addColorStop(1, '#3b2554');
            ctx.fillStyle = dawnGrad;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => p.draw(ctx));

            if (processedGuardianCanvas) {
                ctx.save();
                const gW = width * 0.48;
                const gH = gW * (processedGuardianCanvas.height / processedGuardianCanvas.width);
                const gx = width / 2;
                const gy = height * 0.44 + Math.sin(timeMs / 600) * 8;
                ctx.translate(gx, gy);

                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + Math.sin(timeMs / 1000) * 0.2;
                    ctx.fillStyle = 'rgba(168, 230, 240, 0.18)';
                    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(angle) * (gW * 0.5), Math.sin(angle) * (gH * 0.4) - gH * 0.3, gW * 0.45, gH * 0.25, angle, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 25;
                ctx.drawImage(processedGuardianCanvas, -gW / 2, -gH, gW, gH);
                ctx.restore();
            }

            ctx.textAlign = 'center';
            if (stateTimer < 3.5) {
                drawText("모든 악몽의 근원... 나이트메어의 균열이 무너진다.", width / 2, height * 0.72, '#ff8888', 17);
                drawText("\"어째서냐... 나는 아이의 실수와 포기에서 태어났는데...\"", width / 2, height * 0.78, '#ccc', 15);
            } else if (stateTimer < 7.5) {
                drawText("수호신의 몸에서 눈부신 사고의 빛이 터져 나온다.", width / 2, height * 0.70, '#a8e6f0', 17);
                drawText("\"틀리는 건 약함이 아니야.\"", width / 2, height * 0.76, '#fff', 20);
                drawText("\"실패는 너의 힘이 아니야.\"", width / 2, height * 0.82, '#ffd700', 22);
            } else if (stateTimer < 12.0) {
                drawText("\"다시 해보는 순간, 그것은 나의 힘이니까!\"", width / 2, height * 0.74, '#00ffea', 23);
                drawText("최후의 비의 — 「사고의 별(Thought Star)」", width / 2, height * 0.81, '#ffd700', 19);
            } else if (stateTimer < 16.5) {

            } else {

        let hasSavedRecord = false;

        function saveWorkoutResult(ch, finalScore, grade, timeSec, starsCount) {
            const stats = loadStoredJson('dream_guardian_stats', {totalSteps:0,totalSquats:0,totalJumps:0,totalCalories:0,totalClears:0});
            stats.totalSteps = (stats.totalSteps || 0) + totalSteps;
            stats.totalSquats = (stats.totalSquats || 0) + totalSquats;
            stats.totalJumps = (stats.totalJumps || 0) + totalJumps;
            stats.totalCalories = (stats.totalCalories || 0) + caloriesBurned;
            stats.totalClears = (stats.totalClears || 0) + 1;
            localStorage.setItem('dream_guardian_stats', JSON.stringify(stats));

            const stars = loadStoredJson('dream_guardian_stars', {});
            stars[ch] = Math.max(stars[ch] || 0, starsCount);
            localStorage.setItem('dream_guardian_stars', JSON.stringify(stars));

            const history = loadStoredJson('dream_guardian_history', []);
            const today = new Date();
            const dateStr = `${today.getMonth() + 1}/${today.getDate()}`;
            history.unshift({
                date: dateStr,
                chapter: ch,
                score: Math.floor(finalScore),
                manaDelivered: totalManaDelivered,
                spellsCast,
                grade: grade,
                time: timeSec,
                steps: totalSteps,
                squats: totalSquats,
                cal: caloriesBurned.toFixed(1)
            });
            if (history.length > 8) history.pop();
            localStorage.setItem('dream_guardian_history', JSON.stringify(history));
        }
