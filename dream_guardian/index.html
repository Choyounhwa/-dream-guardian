<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>꿈의 수호신 (Dream Guardian)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050308;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Gowun Batang', serif;
      color: #e0f0ff;
      user-select: none;
    }
    #container {
      position: relative;
      width: min(100vw, calc(100vh * (9 / 18)));
      height: min(100vh, calc(100vw * (18 / 9)));
      aspect-ratio: 9 / 18;
      background: #0a0a1a;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
      overflow: hidden;
      touch-action: auto;
    }
    @media (max-width: 500px) and (aspect-ratio: 9/18) {
      #container { width: 100vw; height: 100vh; box-shadow: none; border-radius: 0; }
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <canvas id="game-canvas"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
