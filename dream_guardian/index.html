        function drawDreamGrid(timeMs) {
            ctx.save();
            const t = timeMs / 1000;
            const horizon = height * 0.38;
            const target = gameState === 'running' ? (runGauge >= 75 ? [35,148,255] : [255,135,25]) : [255,50,22];
            const glow = 0.72 + Math.sin(t * 2.1) * 0.12;
            const r = Math.round(target[0] * glow);
            const g = Math.round(target[1] * glow);
            const b = Math.round(target[2] * glow);
            const speed = gameState === 'running' ? 1.5 + runGauge / 35 : 0.65;

            ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0,0,width,height);

            const floorH = height - horizon;
            const ceilH = horizon;

            // 세로선: 수평선(horizon)에서 세로선들이 한 점에 뭉치지 않도록 소실 폭(vanishRatio)을 둠
            const numCols = Math.max(8, Math.round(width / 60));
            const spacingBottom = (width / numCols) * 1.55;
            const spacingTop = (width / numCols) * 1.55;
            const vanishRatio = 0.16;
            const spacingHorizon = spacingBottom * vanishRatio;

            // 심도 표현: 소실점(horizon) 부근에서 바깥(위/아래)으로 멀어질수록 점차 흐려지는 그라데이션
            const gradFloor = ctx.createLinearGradient(0, horizon, 0, height);
            gradFloor.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
            gradFloor.addColorStop(0.35, `rgba(${r},${g},${b},0.55)`);
            gradFloor.addColorStop(0.7, `rgba(${r},${g},${b},0.24)`);
            gradFloor.addColorStop(1, `rgba(${r},${g},${b},0.05)`);

            const gradCeil = ctx.createLinearGradient(0, horizon, 0, 0);
            gradCeil.addColorStop(0, `rgba(${r},${g},${b},0.80)`);
            gradCeil.addColorStop(0.35, `rgba(${r},${g},${b},0.50)`);
            gradCeil.addColorStop(0.7, `rgba(${r},${g},${b},0.22)`);
            gradCeil.addColorStop(1, `rgba(${r},${g},${b},0.04)`);

            ctx.lineWidth = 1.8;
            ctx.shadowBlur = 6;
            ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;

            // 세로선 그리기: 상단과 하단이 horizon의 xHorizon에서 완벽하게 맞닿아 연결됨
            const maxIdx = Math.ceil((width * 1.4) / spacingBottom);
            for (let i = -maxIdx; i <= maxIdx; i++) {
                const xBottom = width / 2 + i * spacingBottom;
                const xHorizon = width / 2 + i * spacingHorizon;
                const xTop = width / 2 + i * spacingTop;

                // 바닥 세로선
                ctx.strokeStyle = gradFloor;
                ctx.beginPath();
                ctx.moveTo(xHorizon, horizon);
                ctx.lineTo(xBottom, height);
                ctx.stroke();

                // 천장 세로선 (수평선에서 상하단이 1:1로 맞닿음)
                ctx.strokeStyle = gradCeil;
                ctx.beginPath();
                ctx.moveTo(xHorizon, horizon);
                ctx.lineTo(xTop, 0);
                ctx.stroke();
            }

            // 가로선 그리기: 소실점에서 멀어질수록 원근 투영 및 점진적 심도 페이드
            const numHorizFloor = 13;
            for (let i = 0; i < numHorizFloor; i++) {
                const z = (t * speed * 0.20 + i / numHorizFloor) % 1;
                const y = horizon + floorH * Math.pow(z, 2.15);
                const alpha = Math.max(0.04, (1 - Math.pow(z, 1.25) * 0.90) * 0.85);
                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const numHorizCeil = 8;
            for (let i = 0; i < numHorizCeil; i++) {
                const z = (t * speed * 0.16 + i / numHorizCeil) % 1;
                const y = horizon - ceilH * Math.pow(z, 2.15);
                const alpha = Math.max(0.03, (1 - Math.pow(z, 1.25) * 0.92) * 0.80);
                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // 상하단이 맞닿는 중앙 수평선 (Horizon 빛 라인)
            ctx.strokeStyle = `rgba(${r},${g},${b},0.9)`;
            ctx.lineWidth = 2.2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${r},${g},${b},0.9)`;
            ctx.beginPath();
            ctx.moveTo(0, horizon);
            ctx.lineTo(width, horizon);
            ctx.stroke();

            ctx.restore();
        }

        function drawStreetFighterHUD() {
            const barH = 18;
            const barW = width * 0.38;
            const topY = 16;

            ctx.save();

            function medallion(x, y, color, guardian) {
                ctx.save(); ctx.fillStyle='#0a1026';ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.shadowColor=color;ctx.shadowBlur=8;
                ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=color;
                if(guardian){ctx.beginPath();ctx.arc(x-3,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0a1026';ctx.beginPath();ctx.arc(x+3,y-5,7,0,Math.PI*2);ctx.fill();}
                else {ctx.beginPath();ctx.arc(x-6,y-2,3,0,Math.PI*2);ctx.arc(x+6,y-2,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0a1026';ctx.fillRect(x-9,y+7,18,3);}
                ctx.restore();
            }

            // 1. LEFT - Guardian energy
            const pX = width * 0.05;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.strokeStyle = '#a8e6ff'; ctx.lineWidth = 2;
            ctx.fillRect(pX, topY, barW, barH);
            ctx.strokeRect(pX, topY, barW, barH);

            const pRatio = Math.max(0, playerHp / 100);
            const pGrad = ctx.createLinearGradient(pX, 0, pX + barW, 0);
            pGrad.addColorStop(0, '#b9eeff');
            pGrad.addColorStop(1, '#7985f4');
            ctx.fillStyle = pGrad;
            ctx.fillRect(pX, topY, barW * pRatio, barH);

            medallion(pX-24,topY+barH/2,'#b9eeff',true);
            ctx.fillStyle='#081127';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(`${playerHp}/100`,pX+7,topY+14);

            // 2. RIGHT - Monster energy
            const bX = width * 0.57;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 2;
            ctx.fillRect(bX, topY, barW, barH);
            ctx.strokeRect(bX, topY, barW, barH);

            const bRatio = Math.max(0, bossHp / bossMaxHp);
            const bGrad = ctx.createLinearGradient(bX, 0, bX + barW, 0);
            bGrad.addColorStop(0, '#ff2440');
            bGrad.addColorStop(1, '#9b0c20');
            ctx.fillStyle = bGrad;
            ctx.fillRect(bX + barW * (1 - bRatio), topY, barW * bRatio, barH);

            medallion(bX+barW+24,topY+barH/2,'#ff3d50',false);
            ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='right';ctx.fillText(`${bossHp}/${bossMaxHp}`,bX+barW-7,topY+14);

            ctx.restore();
        }

        function drawManaFlask(cx, cy, ratio) {
            const w = 40;

            ctx.save();

            // Flask BG
            ctx.fillStyle = 'rgba(0,0,0,0.7)';

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-w/2, 0);
            ctx.lineTo(w/2, 0);
            ctx.lineTo(w/2, h);
            ctx.lineTo(-w/2, h);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            // Fill
            const fillH = h * ratio;
            ctx.fillStyle = 'rgba(0, 229, 255, 0.8)';
            ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
            ctx.fillRect(-w/2, h - fillH, w, fillH);
            
            ctx.restore();
        }

            if (audioCtx?.state === 'suspended') audioCtx.resume();
            if (e.code === 'Space') {
                if (gameState === 'ready_position') {
                    runGauge = 100;
                    playSound('start');
                    changeState('running');
                } else if (gameState === 'running') {
                    runGauge += 15;
                    totalSteps += 2;
                } else if (gameState === 'story_intro') {
                    startGameplay();
                } else if (gameState === 'ending_cutscene') {
                    changeState('result');
                }
            } else if (gameState === 'playing' && targetOptions && targetOptions.length >= 2) {
                if (e.code === 'Digit1') handleAnswer(targetOptions[0]);
                else if (e.code === 'Digit2') handleAnswer(targetOptions[1]);
            } else if (e.code === 'ArrowDown') {
                // Test Squat
                isSquatting = true; totalSquats++; playSound('shield_deflect');
                if (bossAttackActive) { bossAttackDeflected = true; bossAttackActive = false; score += 150; }
                setTimeout(() => { isSquatting = false; }, 1000);
            } else if (e.code === 'ArrowUp') {
                // Test Jump
                totalJumps++; playSound('jump_whoosh');
                if (gameState === 'running') runGauge = Math.min(100, runGauge + 25);
            }
        });

        document.getElementById('question_panel').addEventListener('pointerdown', e => e.stopPropagation());
        function closePauseMenu() {
            gamePaused = false;
            document.getElementById('pause_menu').classList.remove('visible');
            document.getElementById('btn_pause').textContent = '멈추기';
        }
        document.getElementById('btn_pause').addEventListener('click', e => {
            e.stopPropagation();
            gamePaused = !gamePaused;
            if (gamePaused) { questionReader.cancel(); questionSpeaking=false; }
            document.getElementById('pause_menu').classList.toggle('visible', gamePaused);
            document.getElementById('btn_pause').textContent = gamePaused ? '계속' : '멈추기';
        });
        document.getElementById('btn_resume').addEventListener('click', closePauseMenu);
        document.getElementById('btn_home').addEventListener('click', () => { closePauseMenu(); questionReader.cancel(); changeState('menu_main'); });
        document.getElementById('btn_pause_home').addEventListener('click', () => { closePauseMenu(); questionReader.cancel(); changeState('menu_main'); });
        document.getElementById('btn_pause_menu').addEventListener('click', () => { closePauseMenu(); changeState('menu_main'); });
        document.getElementById('btn_pause_records').addEventListener('click', () => { showRecordsModal(); });
        document.addEventListener('visibilitychange', () => {
            resetTracking();
            if (document.hidden) {
                questionReader.cancel(); questionSpeaking = false;
                questionReadinessTimer = Math.max(1, questionReadinessTimer);
            }
            if (!document.hidden && currentStream) {
                videoElement.play().catch(() => setCameraStatus('카메라 재생이 멈췄습니다. 새로고침하세요.'));
            }
        });

        document.getElementById('btn_fullscreen').addEventListener('click', (e) => {
            e.stopPropagation();
            if (audioCtx?.state === 'suspended') audioCtx.resume();
            playSound('hover');
            const el = document.getElementById('container');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        });

        document.getElementById('btn_close_records').addEventListener('click', (e) => {
            e.stopPropagation();
            playSound('hover');
            document.getElementById('records_modal').classList.add('hidden');
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (audioCtx?.state === 'suspended') audioCtx.resume();
            if (gamePaused) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const px = (e.clientX - rect.left) * scaleX;
            const py = (e.clientY - rect.top) * scaleY;
            playSound('hover');

            if (gameState === 'menu_main') {
                // Check Chapter buttons
                for(let i=1; i<=5; i++) {
                    const y = height * 0.28 + (i-1) * height * 0.10;
                    if (px > width * 0.08 && px < width * 0.92 && py > y-28 && py < y+28) {
                        const isUnlocked = i <= unlockedChapter;
                        if (isUnlocked) {
                            currentLevel = i;
                            if (i === 5) {
                                currentSubLevel = 1;
                                changeState('story_intro');
                            } else {
                                changeState('menu_sub');
                            }
                            return;
                        }
                    }
                }
                // Check Records Modal button
                if (px > width * 0.08 && px < width * 0.92 && py > height * 0.85 - 10 && py < height * 0.85 + 55) {
                    showRecordsModal();
                    return;
                }
            } else if (gameState === 'menu_sub') {
                const levelData = dynamicLevels.find(l=>l.id === currentLevel);
                if(levelData && levelData.subLevels) {
                    levelData.subLevels.forEach((sub, idx) => {
                        const y = height * 0.32 + idx * height * 0.09;
                        if (px > width * 0.08 && px < width * 0.92 && py > y-26 && py < y+26) {
                            currentSubLevel = sub.id;
                            changeState('story_intro');
                        }
                    });
                }
                if (!levelData || !levelData.subLevels || levelData.subLevels.length === 0) {
                    if (py > height * 0.40 - 28 && py < height * 0.40 + 28) {
                        currentSubLevel = 1;
                        changeState('story_intro');
                    }
                }
                // Back button
                if (py > height * 0.75 - 25 && py < height * 0.75 + 50) {
                    changeState('menu_main');
                }
            } else if (gameState === 'story_intro') {
                startGameplay();
            } else if (gameState === 'ending_cutscene') {
                if (stateTimer > 3.0) {
                    changeState('result');
                } else {
                    stateTimer = 16.5;
                }
            } else if (gameState === 'result' || gameState === 'gameover') {
                if (py > height*0.73 && py < height*0.73+48) {
                    // Retry
                    changeState('story_intro');
                } else if (py > height*0.83 && py < height*0.83+48) {
                    // Menu
                    if (gameState === 'result' && currentLevel < 4 && correctCount >= 7) {
                        unlockedChapter = Math.max(unlockedChapter, currentLevel + 1);
                        localStorage.setItem('dream_guardian_progress', unlockedChapter.toString());
                    }
                    changeState('menu_main');
                }
            } else if (gameState === 'playing') {
                const b=AnswerSelection.board(width,height);
                const p={x:(px-b.x)/b.w,y:(py-b.y)/b.h,vis:1};
                const choice=targetOptions.find((option,index)=>{
                    const x=index===0?width*.18:width*.82,y=height*.445,r=width*.13;
                    if(Math.hypot(px-x,py-y)<=r)return true;
                    return option.activeZoneIds.some(zoneId=>{
                        const zone=AnswerSelection.ZONES.find(z=>z.id===zoneId);
                        const candidates=targetOptions.filter(other=>other.requirements.some(req=>AnswerSelection.canPartUseZone(req.part,zoneId)));
                        return candidates.length===1&&candidates[0]===option&&AnswerSelection.contains(zone,p);
                    });
                });
                if(choice) handleAnswer(choice);
            } else if (gameState === 'running') {
                // Touch Fallback Run
                runGauge += 15;
                totalSteps += 2;
            } else if (gameState === 'ready_position') {
                runGauge += 1.0;
                if (runGauge > 2.0) { playSound('start'); changeState('running'); }
            }
        });

        function startGameplay() {
            guardianMana = 0;
            totalManaDelivered = 0;
            spellsCast = 0;
            spellImpactDone = false;
            answerGate.reset();
            targetOptions = [];
            prevMotionData = null;
            bossMaxHp = currentLevel === 5 ? 20 : 10;
            bossHp = bossMaxHp;
            playerHp = 100;
            score = 0;
            questionCount = 0;
            correctCount = 0;
            maxCombo = 0;
            currentCombo = 0;
            runGauge = 0;
            particles = [];
            totalSteps = 0;
            totalSquats = 0;
            totalJumps = 0;
            caloriesBurned = 0;
            isSquatting = false;
            wasSquatting = false;
            isJumping = false;
            wasJumping = false;
            jumpCooldown = 0;
            runStepTimer = 0;
            bossAttackActive = false;
            bossAttackTimer = 0;
            bossAttackDeflected = false;
            bossAttackCooldown = 8;
            trackOrbs = [];
            hasSavedRecord = false;
            gameStartTime = Date.now();
            startBGM();
            changeState('ready_position');
        }

        // Start Loop
        initCamera();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
