<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>피트니스 안무 & 비트 타임라인 에디터 (Dance Studio)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090a10;
      --bg-header: #111420;
      --bg-panel: #151827;
      --bg-card: #1c2136;
      --bg-card-selected: #242c48;
      --border-color: #272f4a;
      --border-focus: #3b4872;
      --text-main: #f0f4fc;
      --text-muted: #8e9bb5;
      --color-cyan: #28E6FF;
      --color-yellow: #FFCB4D;
      --color-purple: #C889FF;
      --color-orange: #FF865E;
      --color-green: #10B981;
      --color-red: #EF4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      font-size: 13px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .editor-app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. Header */
    .editor-header {
      height: 54px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .editor-logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-cyan);
      letter-spacing: -0.5px;
    }

    .editor-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      padding-left: 8px;
      border-left: 1px solid var(--border-color);
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 2. Main Body */
    .editor-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* 2.1 Sidebar */
    .editor-sidebar {
      width: 360px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-yellow);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-cyan);
      margin: 14px 0 8px 0;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    .pattern-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .pattern-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pattern-card:hover {
      border-color: var(--color-cyan);
      background: #202740;
    }

    .pattern-card.selected {
      border-color: var(--color-cyan);
      background: var(--bg-card-selected);
      box-shadow: 0 0 10px rgba(40, 230, 255, 0.15);
    }

    .pattern-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .pattern-id {
      font-size: 11px;
      font-family: monospace;
      color: var(--color-cyan);
      font-weight: 600;
    }

    .pattern-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .badge-low_bounce { background: rgba(40, 230, 255, 0.15); color: var(--color-cyan); }
    .badge-sky_point_right { background: rgba(255, 203, 77, 0.15); color: var(--color-yellow); }
    .badge-center_clasp { background: rgba(200, 137, 255, 0.15); color: var(--color-purple); }
    .badge-sky_point_left { background: rgba(255, 134, 94, 0.15); color: var(--color-orange); }

    .pattern-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Forms */
    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .form-row label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .editor-input,
    .editor-select,
    .editor-textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .editor-input:focus,
    .editor-select:focus,
    .editor-textarea:focus {
      border-color: var(--color-cyan);
    }

    .editor-input.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .zone-select {
      width: 140px;
    }

    .editor-input-number {
      width: 65px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--text-main);
      font-size: 12px;
      text-align: center;
    }

    .checkbox-group {
      display: flex;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Validation Box */
    .validation-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    .validation-box.valid {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--color-green);
      color: #6ee7b7;
    }

    .validation-box.invalid {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--color-red);
      color: #fca5a5;
    }

    .validation-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .validation-errors {
      margin-left: 14px;
      line-height: 1.4;
    }

    /* 2.2 Workspace */
    .editor-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0f19;
      position: relative;
      overflow: hidden;
    }

    .workspace-toolbar {
      height: 38px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(21, 24, 39, 0.5);
    }

    .workspace-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .active-pattern-label strong {
      color: var(--color-cyan);
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }

    #editor-canvas {
      width: 100%;
      max-width: 840px;
      height: 100%;
      max-height: 580px;
      background: #0a0c16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      cursor: crosshair;
    }

    .workspace-footer {
      padding: 8px 16px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .legend-title {
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .cursor-lh .dot { background: var(--color-cyan); }
    .cursor-rh .dot { background: var(--color-yellow); }
    .cursor-head .dot { background: var(--color-purple); }
    .cursor-hip .dot { background: var(--color-orange); }

    .legend-info {
      color: var(--text-muted);
    }

    /* 3. Timeline */
    .editor-timeline-panel {
      height: 140px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }

    .timeline-header {
      height: 32px;
      padding: 0 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timeline-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timeline-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(40, 230, 255, 0.2);
      color: var(--color-cyan);
    }

    .timeline-prompt {
      font-size: 11px;
      color: var(--text-main);
    }

    .timeline-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .timeline-container {
      flex: 1;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 16px;
    }

    .timeline-ruler {
      height: 26px;
      display: flex;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .ruler-tick {
      flex: 1;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 6px;
    }

    .tick-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .timeline-tracks {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 6px;
    }

    .track-row {
      height: 28px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
    }

    .track-label {
      width: 80px;
      padding-left: 8px;
      font-size: 11px;
      color: var(--text-muted);
      border-right: 1px solid var(--border-color);
    }

    .track-lane {
      flex: 1;
      height: 100%;
      position: relative;
    }

    .timeline-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 16px;
      width: 2px;
      pointer-events: none;
      z-index: 10;
    }

    .playhead-line {
      width: 2px;
      height: 100%;
      background: var(--color-cyan);
      box-shadow: 0 0 8px var(--color-cyan);
    }

    .playhead-handle {
      position: absolute;
      top: -2px;
      left: -5px;
      font-size: 12px;
      color: var(--color-cyan);
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-play {
      background: #10B981;
      color: white;
    }
    .btn-play:hover { background: #059669; }

    .btn-pause {
      background: #F59E0B;
      color: white;
    }
    .btn-pause:hover { background: #D97706; }

    .btn-secondary {
      background: #374151;
      color: white;
    }
    .btn-secondary:hover { background: #4B5563; }

    .btn-accent {
      background: #6366F1;
      color: white;
    }
    .btn-accent:hover { background: #4F46E5; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover {
      border-color: var(--color-cyan);
      color: var(--color-cyan);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover {
      color: var(--text-main);
    }

    .beat-display {
      font-family: monospace;
      font-size: 12px;
      color: var(--color-cyan);
      font-weight: 700;
      padding: 0 8px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
