    function drawPlayerPositionGuide(ctx, width, height, results, dt) {
      const isPortrait = height > width;
      const guideH = isPortrait ? Math.min(height * 0.62, 520) : Math.max(460, Math.min(680, height * 0.72));
      const guideW = isPortrait ? Math.min(width * 0.80, guideH * 0.45) : guideH * 0.46;
      const guideX = width / 2;
      const guideY = isPortrait ? height * 0.48 : height * 0.52;

      // 상단 배너 안내문구
      const bannerW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(580, width * 0.65);
      const bannerH = isPortrait ? 84 : 95;
      const bannerX = (width - bannerW) / 2;
      const bannerY = Math.max(16, height * 0.035);

      drawClothBanner(ctx, bannerX, bannerY, bannerW, bannerH, "영웅 정렬 & 결계 전개 준비");

      // 사용자 자세 판정
      let isInside = false;
      if (results && results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const nose = lm[0];
        const shoulderL = lm[11];
        const shoulderR = lm[12];

        if (nose && shoulderL && shoulderR) {
          const userNoseX = 1.0 - nose.x;
          const userNoseY = nose.y;
          const userShoulderX = 1.0 - (shoulderL.x + shoulderR.x) / 2;
          const userShoulderY = (shoulderL.y + shoulderR.y) / 2;
          const shoulderVis = ((shoulderL.visibility || 0) + (shoulderR.visibility || 0)) / 2;

          const noseInX = userNoseX >= 0.33 && userNoseX <= 0.67;
          const noseInY = userNoseY >= 0.10 && userNoseY <= 0.45;
          const shoulderInX = userShoulderX >= 0.30 && userShoulderX <= 0.70;
          const shoulderInY = userShoulderY >= 0.18 && userShoulderY <= 0.62;

          if (noseInX && noseInY && shoulderInX && shoulderInY && shoulderVis > 0.30) {
            isInside = true;
          }
        }
      }

      // 진행률 업데이트
      if (isInside) {
        if (readyPositionProgress === 0) playSound('hover');
        readyPositionProgress = Math.min(1.0, readyPositionProgress + dt / 1.2);
      } else {
        readyPositionProgress = Math.max(0, readyPositionProgress - dt * 1.5);
      }

      // 안내 텍스트 렌더링
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (isInside) {
        ctx.font = `bold 24px 'Gowun Batang', 'Cinzel', serif`;
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 12;
        ctx.fillText(`✨ 자세 일치! 결계 진입 중... ${Math.min(100, Math.floor(readyPositionProgress * 100))}%`, bannerX + bannerW / 2, bannerY + bannerH * 0.62);
      } else {
        ctx.font = `bold 22px 'Gowun Batang', 'Cinzel', serif`;
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 6;
        ctx.fillText("이 모양 안에 서주세요", bannerX + bannerW / 2, bannerY + bannerH * 0.52);
        ctx.font = `15px 'Gowun Batang', sans-serif`;
        ctx.fillStyle = '#ffe082';
        ctx.fillText("카메라를 마주보고 머리와 양 어깨를 가이드에 맞춰주세요", bannerX + bannerW / 2, bannerY + bannerH * 0.76);
      }
      ctx.restore();

      // 휴머노이드 실루엣 아웃라인 렌더링
      ctx.save();
      const themeColor = isInside ? '#00ffcc' : 'rgba(255, 215, 0, 0.85)';
      const glowColor = isInside ? '#00e5ff' : 'rgba(255, 150, 0, 0.6)';
      const fillColor = isInside ? 'rgba(0, 255, 200, 0.12)' : 'rgba(255, 215, 0, 0.05)';

      ctx.strokeStyle = themeColor;
      ctx.lineWidth = isInside ? 4.5 : 3.0;
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = isInside ? 24 : 12;

      // 4개 마법 코너 브래킷
      const pad = 24;
      const bW = guideW + pad * 2;
      const bH = guideH + pad * 2;
      const bX = guideX - bW / 2;
      const bY = guideY - bH / 2;
      const bracketLen = 36;
      ctx.beginPath();
      // TL
      ctx.moveTo(bX, bY + bracketLen); ctx.lineTo(bX, bY); ctx.lineTo(bX + bracketLen, bY);
      // TR
      ctx.moveTo(bX + bW - bracketLen, bY); ctx.lineTo(bX + bW, bY); ctx.lineTo(bX + bW, bY + bracketLen);
      // BL
      ctx.moveTo(bX, bY + bH - bracketLen); ctx.lineTo(bX, bY + bH); ctx.lineTo(bX + bracketLen, bY + bH);
      // BR
      ctx.moveTo(bX + bW - bracketLen, bY + bH); ctx.lineTo(bX + bW, bY + bH); ctx.lineTo(bX + bW, bY + bH - bracketLen);
      ctx.stroke();

      // 전신 실루엣 경로 (머리, 어깨, 몸통, 팔, 다리)
      const headR = guideH * 0.088;
      const headY = guideY - guideH * 0.36;

      // 머리 원
      ctx.beginPath();
      ctx.arc(guideX, headY, headR, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.stroke();

      // 어깨, 몸통, 팔, 다리 유려한 실루엣
      ctx.beginPath();
      const sY = headY + headR * 1.35;
      const sHalfW = guideW * 0.44;
      const wY = guideY + guideH * 0.08;
      const wHalfW = guideW * 0.28;
      const hY = guideY + guideH * 0.16;
      const hHalfW = guideW * 0.36;
      const kY = guideY + guideH * 0.32;
      const kHalfW = guideW * 0.24;
      const fY = guideY + guideH * 0.47;
      const fHalfW = guideW * 0.22;

      // 목 -> 좌측 어깨 -> 좌측 팔 -> 좌측 손
      ctx.moveTo(guideX - headR * 0.38, headY + headR * 0.95);
      ctx.lineTo(guideX - sHalfW, sY);
      ctx.lineTo(guideX - sHalfW * 1.25, sY + guideH * 0.22);
      ctx.lineTo(guideX - sHalfW * 1.15, sY + guideH * 0.42);
      ctx.lineTo(guideX - sHalfW * 0.85, sY + guideH * 0.40);
      ctx.lineTo(guideX - sHalfW * 0.90, sY + guideH * 0.22);
      // 몸통 좌측 허리 -> 엉덩이
      ctx.lineTo(guideX - wHalfW, wY);
      ctx.lineTo(guideX - hHalfW, hY);
      // 좌측 다리 -> 무릎 -> 발
      ctx.lineTo(guideX - kHalfW, kY);
      ctx.lineTo(guideX - fHalfW, fY);
      ctx.lineTo(guideX - fHalfW * 0.45, fY);
      ctx.lineTo(guideX - kHalfW * 0.45, kY);
      // 사타구니 중앙
      ctx.lineTo(guideX, hY + guideH * 0.05);
      // 우측 다리 -> 무릎 -> 발
      ctx.lineTo(guideX + kHalfW * 0.45, kY);
      ctx.lineTo(guideX + fHalfW * 0.45, fY);
      ctx.lineTo(guideX + fHalfW, fY);
      ctx.lineTo(guideX + kHalfW, kY);
      // 몸통 우측 엉덩이 -> 허리
      ctx.lineTo(guideX + hHalfW, hY);
      ctx.lineTo(guideX + wHalfW, wY);
      // 우측 팔 -> 팔꿈치 -> 손목/손
      ctx.lineTo(guideX + sHalfW * 0.90, sY + guideH * 0.22);
      ctx.lineTo(guideX + sHalfW * 0.85, sY + guideH * 0.40);
      ctx.lineTo(guideX + sHalfW * 1.15, sY + guideH * 0.42);
      ctx.lineTo(guideX + sHalfW * 1.25, sY + guideH * 0.22);
      ctx.lineTo(guideX + sHalfW, sY);
      // 우측 목
      ctx.lineTo(guideX + headR * 0.38, headY + headR * 0.95);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.stroke();

      // 머리 주위 원형 게이지 (Dwell Ring)
      if (readyPositionProgress > 0) {
        ctx.beginPath();
        ctx.arc(guideX, headY, headR * 1.45, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * readyPositionProgress);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 6;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 18;
        ctx.stroke();
      }

      // 하단 스킵 / 즉시 시작 버튼 (바닥 중앙)
      const skipBtnW = isPortrait ? Math.min(width * 0.84, 320) : Math.max(220, width * 0.20);
      const skipBtnH = 46;
      const skipBtnX = (width - skipBtnW) / 2;
      const skipBtnY = isPortrait ? Math.min(height - 52, bY + bH + 15) : Math.min(height - 65, bY + bH + 18);

      // 손바닥 지팡이 팁 호버 시 즉시 시작 지원
      let pLeft = results && results.poseLandmarks ? getPalm(results.poseLandmarks, true, width, height) : null;
      let pRight = results && results.poseLandmarks ? getPalm(results.poseLandmarks, false, width, height) : null;
      const inSkipBtn = (p) => {
        if (!p) return false;
        const inP = p.x >= skipBtnX && p.x <= skipBtnX + skipBtnW && p.y >= skipBtnY && p.y <= skipBtnY + skipBtnH;
        const inT = p.tipX ? (p.tipX >= skipBtnX && p.tipX <= skipBtnX + skipBtnW && p.tipY >= skipBtnY && p.tipY <= skipBtnY + skipBtnH) : false;
        return inP || inT;
      };
      if (inSkipBtn(pLeft) || inSkipBtn(pRight)) {
        readyPositionProgress = 1.0;
      }

      ctx.fillStyle = 'rgba(25, 12, 6, 0.85)';
      ctx.beginPath();
      ctx.roundRect(skipBtnX, skipBtnY, skipBtnW, skipBtnH, 8);
      ctx.fill();
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffe082';
      ctx.font = `bold 16px 'Gowun Batang', 'Cinzel', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 4;
      ctx.fillText("▶ 즉시 시작 (클릭 또는 스페이스바)", skipBtnX + skipBtnW / 2, skipBtnY + skipBtnH / 2);

      ctx.restore();

      // 100% 충전 시 달리기 모드로 전환
      if (readyPositionProgress >= 1.0) {
        readyPositionProgress = 0;
        playSound('start');
        startTime = Date.now();
        gameState = "running";
        startBGM();
        spawnAlliedMinionWave(4);
      }
    }

    function onResults(results) {
      if (loadingText.style.display !== 'none') loadingText.style.display = 'none';

      const width = canvasElement.width;
      const height = canvasElement.height;
      const isPortrait = height > width;

      canvasCtx.setTransform(1, 0, 0, 1, 0, 0);
      canvasCtx.clearRect(0, 0, width, height);

      // 웹캠 비디오 종횡비에 맞춘 object-fit: cover 크롭 계산 (가로 왜곡 방지)
      const img = results.image;
      const imgW = img.videoWidth || img.naturalWidth || img.width || 1280;
      const imgH = img.videoHeight || img.naturalHeight || img.height || 720;
      const canvasAspect = width / height;
      const imgAspect = imgW / imgH;

      let sx = 0, sy = 0, sw = imgW, sh = imgH;
      if (imgAspect > canvasAspect) {
        sw = imgH * canvasAspect;
        sx = (imgW - sw) / 2;
      } else {
        sh = imgW / canvasAspect;
        sy = (imgH - sh) / 2;
      }

      // 랜드마크 좌표를 크롭된 캔버스 뷰포트에 맞게 비례 재매핑
      if (results.poseLandmarks) {
        results.poseLandmarks = results.poseLandmarks.map(lm => ({
          x: (lm.x * imgW - sx) / sw,
          y: (lm.y * imgH - sy) / sh,
          z: lm.z,
          visibility: lm.visibility
        }));
      }

      canvasCtx.save();
      canvasCtx.translate(width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.globalAlpha = (gameState.startsWith("menu") || gameState==="result" || gameState==="paused") ? 0.5 : 0.8;
      canvasCtx.drawImage(img, sx, sy, sw, sh, 0, 0, width, height);
      
      // 타격 프레임 시 화이트 플래시 (Hit Stop Flash)
      if (gameState === 'correct') {
          let elapsed = Date.now() - stateTimer;
          if (elapsed < 50) {
              canvasCtx.fillStyle = combo >= 3 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 255, 255, 0.5)';
              canvasCtx.fillRect(0, 0, width, height);
          }
      }
      
      canvasCtx.globalAlpha = 1.0;
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: 'rgba(0,255,0,0.5)', lineWidth: 4});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: 'rgba(255,0,0,0.5)', lineWidth: 2, radius: 3});
      }
      canvasCtx.restore();

      if (gameState === "paused") {
          canvasCtx.fillStyle = 'rgba(10, 5, 2, 0.75)';
          canvasCtx.fillRect(0, 0, width, height);
          
          const pScrollW = isPortrait ? Math.min(width * 0.92, 440) : 540;
          const pScrollH = isPortrait ? height * 0.58 : height * 0.62;
          const pScrollX = width / 2 - pScrollW / 2;
          const pScrollY = isPortrait ? height * 0.21 : height * 0.20;
          drawParchmentScroll(canvasCtx, pScrollX, pScrollY, pScrollW, pScrollH, "일시 정지 (PAUSED)");

          const btnW = Math.min(pScrollW * 0.82, 400);
          const btnH = isPortrait ? Math.min(52, height * 0.08) : height * 0.11;
          const resumeBtn = { x: width/2 - btnW/2, y: pScrollY + pScrollH * 0.38, w: btnW, h: btnH, text: "결계 재개 (계속하기)" };
          const quitBtn = { x: width/2 - btnW/2, y: pScrollY + pScrollH * 0.62, w: btnW, h: btnH, text: "아카데미로 (메뉴로)" };
          
          if (!window.pauseProgressMap) window.pauseProgressMap = { resume: 0, quit: 0 };

          const leftPalm = getPalm(results.poseLandmarks, true, width, height);
          const rightPalm = getPalm(results.poseLandmarks, false, width, height);

          const checkBtn = (btn, lp, rp) => {
              const check = (p) => {
                 if(!p) return false;
                 const inPalm = (p.x > btn.x && p.x < btn.x+btn.w && p.y > btn.y && p.y < btn.y+btn.h);
                 const inTip = p.tipX ? (p.tipX > btn.x && p.tipX < btn.x+btn.w && p.tipY > btn.y && p.tipY < btn.y+btn.h) : false;
                 return inPalm || inTip;
              };
              return check(lp) || check(rp);
          };

          if (checkBtn(resumeBtn, leftPalm, rightPalm)) {
              if(window.pauseProgressMap.resume === 0) playSound('hover');
              window.pauseProgressMap.resume += 2;
              if (window.pauseProgressMap.resume >= 100) {
                  window.pauseProgressMap.resume = 0;
                  playSound('start');
                  gameState = previousGameState;
                  if (bgmEnabled) startBGM();
                  if (gameState === "playing" && isCrossMode) startCrossSound();
                  renderCursors(results, canvasCtx, width, height);
                  return;
              }
          } else { window.pauseProgressMap.resume = Math.max(0, window.pauseProgressMap.resume - 3); }

          if (checkBtn(quitBtn, leftPalm, rightPalm)) {
              if(window.pauseProgressMap.quit === 0) playSound('hover');
              window.pauseProgressMap.quit += 2;
              if (window.pauseProgressMap.quit >= 100) {
                  window.pauseProgressMap.quit = 0;
                  playSound('start');
                  initMenuMain();
                  renderCursors(results, canvasCtx, width, height);
                  return;
              }
          } else { window.pauseProgressMap.quit = Math.max(0, window.pauseProgressMap.quit - 3); }

          [resumeBtn, quitBtn].forEach(b => {
              canvasCtx.save();
              canvasCtx.fillStyle = '#2b170c';
              canvasCtx.fillRect(b.x, b.y, b.w, b.h);
              let prog = b === resumeBtn ? window.pauseProgressMap.resume : window.pauseProgressMap.quit;
              if (prog > 0) {
                canvasCtx.fillStyle = 'rgba(0, 230, 255, 0.45)';
                canvasCtx.fillRect(b.x, b.y, b.w * (prog/100), b.h);
              }
              canvasCtx.strokeStyle = '#ffd700';
              canvasCtx.lineWidth = 3;
              canvasCtx.strokeRect(b.x, b.y, b.w, b.h);
              canvasCtx.fillStyle = '#ffe082';
              canvasCtx.font = `bold ${Math.floor(b.h*0.42)}px 'Cinzel', 'Gowun Batang', serif`;
              canvasCtx.textAlign = 'center';
              canvasCtx.textBaseline = 'middle';
              canvasCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
              canvasCtx.shadowBlur = 6;
              canvasCtx.fillText(b.text, b.x + b.w/2, b.y + b.h/2);
              canvasCtx.restore();
          });
          renderCursors(results, canvasCtx, width, height);
          return;
      }

      if (gameState === "menu_main" || gameState === "menu_sub" || gameState === "result" || gameState === "gameover") {
        if (gameState !== "result" && gameState !== "gameover") {
            // 상단 양피지 퀘스트 배너
            const bannerText = gameState === "menu_main" 
              ? "마법 연금술 아카데미 : 연산 퀘스트" 
              : `[ ${getLevelTitle(currentLevel)} ] 난이도 선택`;
            drawParchmentScroll(canvasCtx, width * 0.18, height * 0.02, width * 0.64, height * 0.08, bannerText);

            // 화면 모서리 황금 코너 브래킷
            canvasCtx.save();
            canvasCtx.strokeStyle = '#ffd700';
            canvasCtx.lineWidth = 4;
            const cSize = Math.min(width, height) * 0.06;
            // Top-Left
            canvasCtx.beginPath(); canvasCtx.moveTo(20, 20 + cSize); canvasCtx.lineTo(20, 20); canvasCtx.lineTo(20 + cSize, 20); canvasCtx.stroke();
            // Top-Right
            canvasCtx.beginPath(); canvasCtx.moveTo(width - 20 - cSize, 20); canvasCtx.lineTo(width - 20, 20); canvasCtx.lineTo(width - 20, 20 + cSize); canvasCtx.stroke();
            // Bottom-Left
            canvasCtx.beginPath(); canvasCtx.moveTo(20, height - 20 - cSize); canvasCtx.lineTo(20, height - 20); canvasCtx.lineTo(20 + cSize, height - 20); canvasCtx.stroke();
            // Bottom-Right
            canvasCtx.beginPath(); canvasCtx.moveTo(width - 20 - cSize, height - 20); canvasCtx.lineTo(width - 20, height - 20); canvasCtx.lineTo(width - 20, height - 20 - cSize); canvasCtx.stroke();
            canvasCtx.restore();
            
            if (results.poseLandmarks) {
              const leftPalm = getPalm(results.poseLandmarks, true, width, height); 
              const rightPalm = getPalm(results.poseLandmarks, false, width, height); 

              // 1. 동시에 여러 메뉴가 선택되지 않고 단 1개만 선택되도록 가장 가까운 타겟 1개 선정 (Single Active Selection)
              let bestBox = null;
              let minDistance = Infinity;

              for (let box of menuBoxes) {
                const pad = box.hovered ? 16 : 0;
                const bx1 = box.x - pad;
                const bx2 = box.x + box.w + pad;
                const by1 = box.y - pad;
                const by2 = box.y + box.h + pad;
                const boxCX = box.x + box.w / 2;
                const boxCY = box.y + box.h / 2;

                const checkPalm = (p) => {
                  if (!p) return Infinity;
                  const inPalm = (p.x >= bx1 && p.x <= bx2 && p.y >= by1 && p.y <= by2);
                  const inTip = p.tipX ? (p.tipX >= bx1 && p.tipX <= bx2 && p.tipY >= by1 && p.tipY <= by2) : false;
                  if (inPalm || inTip) {
                    const dPalm = Math.hypot(p.x - boxCX, p.y - boxCY);
                    const dTip = p.tipX ? Math.hypot(p.tipX - boxCX, p.tipY - boxCY) : dPalm;
                    return Math.min(dPalm, dTip);
                  }
                  return Infinity;
                };

                const distL = checkPalm(leftPalm);
                const distR = checkPalm(rightPalm);
                const minDist = Math.min(distL, distR);

                if (minDist < Infinity && minDist < minDistance) {
                  minDistance = minDist;
                  bestBox = box;
                }
              }

              // 2. 오직 선정된 bestBox만 hover 진행, 나머지 모든 메뉴는 decay 처리! (유지시간: 3.0초)
              for (let box of menuBoxes) {
                if (box === bestBox) {
                  if (!box.hovered) { box.hovered = true; playSound('hover'); }
                  box.progress += 0.5555; // 60fps 기준 180프레임 = 약 3.0초 유지시 100% 완료
                } else {
                  box.hovered = false;
                  box.progress = Math.max(0, box.progress - 1.5);
                }

                if (box.progress >= 100) {
                  if (box.flash < 15) {
                    box.flash++;
                  } else {
                    playSound('start');
                    if (gameState === "menu_main") {
                      initMenuSub(box.id);
                    } else {
                      if (box.id === "back") initMenuMain();
                      else startGame(box.id);
                    }
                    renderCursors(results, canvasCtx, width, height);
                    return;
                  }
                } else {
                  box.flash = 0;
                }
              }
            }

            // 디아블로 II 스타일 고딕 철제 기술 플레이트로 버튼 렌더링
            for(let box of menuBoxes) {
              drawDiabloStyleMetalPlate(canvasCtx, box);
            }
         } else if (gameState === "result") {
            // ================= 결과 화면 (왕립 마법 아카데미 토벌 보고서) =================
            canvasCtx.fillStyle = 'rgba(8, 4, 2, 0.88)';
            canvasCtx.fillRect(0, 0, width, height);

            const docW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(width * 0.76, 880);
            const docH = isPortrait ? height * 0.92 : height * 0.88;
            const docX = width / 2 - docW / 2;
            const docY = isPortrait ? height * 0.04 : height * 0.06;
            drawParchmentScroll(canvasCtx, docX, docY, docW, docH, "왕립 마법 연금술 아카데미 토벌 보고서");

            canvasCtx.save();
            canvasCtx.textAlign = 'center';

            // 클리어 타이틀
            canvasCtx.font = `bold ${Math.floor(docH * 0.070)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#b8860b';
            canvasCtx.shadowColor = '#ffe082';
            canvasCtx.shadowBlur = 10;
            canvasCtx.fillText(`[ ${getSubTitle(currentLevel, currentSubLevel)} ] 토벌 완료!`, width/2, docY + docH * 0.15, docW * 0.88);

            // 최종 점수 및 랭크 계산 공식
            const clearTimeSec = Math.max(1, (endTime - startTime) / 1000);
            const timeBonus = Math.max(0, Math.floor((120 - clearTimeSec) * 35));
            const comboBonus = maxCombo * 350;
            const correctBonus = MAX_QUESTIONS_PER_LEVEL * 1000;
            const wrongPenalty = totalWrongCount * 400;
            const finalScore = Math.max(0, correctBonus + comboBonus + timeBonus - wrongPenalty);
            
            let grade = 'D (수련생)';
            let gradeColor = '#777777';
            if (finalScore >= 13000) { grade = 'S (신화적 대마도사)'; gradeColor = '#ff2200'; }
            else if (finalScore >= 10000) { grade = 'A (왕립 대마법사)'; gradeColor = '#d4af37'; }
            else if (finalScore >= 7500) { grade = 'B (숙련 연금술사)'; gradeColor = '#0088cc'; }
            else if (finalScore >= 5000) { grade = 'C (견습 마도사)'; gradeColor = '#2e7d32'; }

            // 보스 격퇴 자막 & 최종 등급
            canvasCtx.font = `bold ${Math.floor(docH * 0.055)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = gradeColor;
            canvasCtx.shadowColor = '#ffe082';
            canvasCtx.shadowBlur = 8;
            canvasCtx.fillText(`최종 등급 : ${grade}`, width/2, docY + docH * 0.23, docW * 0.88);

            // 최종 점수 표기
            canvasCtx.font = `bold ${Math.floor(docH * 0.055)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#8b0000';
            canvasCtx.shadowBlur = 0;
            canvasCtx.fillText(`종합 점수 : ${finalScore.toLocaleString()} 점`, width/2, docY + docH * 0.31, docW * 0.88);

            // 세부 점수 내역
            canvasCtx.font = `bold ${Math.floor(docH * 0.035)}px 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#2c1808';
            canvasCtx.fillText(`정답: +${correctBonus}점  |  최고콤보(${maxCombo}): +${comboBonus}점`, width/2, docY + docH * 0.38, docW * 0.88);
            canvasCtx.fillText(`신속클리어(${clearTimeSec.toFixed(1)}초): +${timeBonus}점  |  오답(${totalWrongCount}회): -${wrongPenalty}점`, width/2, docY + docH * 0.44, docW * 0.88);

            // 명예의 전당 Top 3
            let records = JSON.parse(localStorage.getItem(`leaderboard_${currentLevel}_${currentSubLevel}`) || "[]");
            canvasCtx.font = `bold ${Math.floor(docH * 0.045)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#7a4805';
            canvasCtx.fillText(`명예의 전당 (최단 시간 Top 3)`, width/2, docY + docH * 0.54, docW * 0.88);

            canvasCtx.font = `bold ${Math.floor(docH * 0.038)}px 'Cinzel', serif`;
            canvasCtx.fillStyle = '#3a210d';
            const medals = ['1위', '2위', '3위'];
            for(let i=0; i<records.length; i++) {
              canvasCtx.fillText(`${medals[i] || `${i+1}위`}: ${records[i]} 초`, width/2, docY + docH * 0.61 + i * docH * 0.06, docW * 0.88);
            }

            // 메뉴로 복귀 버튼 (밀랍 인장 스타일)
            const returnBtnW = isPortrait ? Math.min(docW * 0.80, 320) : Math.min(docW * 0.55, 360);
            const returnBtnH = isPortrait ? Math.min(50, docH * 0.08) : docH * 0.09;
            const returnBtnX = width / 2 - returnBtnW / 2;
            const returnBtnY = docY + docH * (isPortrait ? 0.86 : 0.84);

            canvasCtx.fillStyle = '#3e1d10';
            canvasCtx.fillRect(returnBtnX, returnBtnY, returnBtnW, returnBtnH);
            if (!this.backProg) this.backProg = 0;
            if (this.backProg > 0) {
              canvasCtx.fillStyle = 'rgba(0, 230, 255, 0.5)';
              canvasCtx.fillRect(returnBtnX, returnBtnY, returnBtnW * (this.backProg/100), returnBtnH);
            }
            canvasCtx.strokeStyle = '#ffd700';
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeRect(returnBtnX, returnBtnY, returnBtnW, returnBtnH);

            canvasCtx.fillStyle = '#ffe082';
            canvasCtx.font = `bold ${Math.floor(returnBtnH * 0.45)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.textBaseline = 'middle';
            canvasCtx.fillText("아카데미로 복귀", width/2, returnBtnY + returnBtnH/2);
            canvasCtx.restore();

           if (results.poseLandmarks) {
             const leftPalm = getPalm(results.poseLandmarks, true, width, height);
             const rightPalm = getPalm(results.poseLandmarks, false, width, height);
             const check = (p) => {
                 if(!p) return false;
                 const inPalm = (p.x > returnBtnX && p.x < returnBtnX + returnBtnW && p.y > returnBtnY && p.y < returnBtnY + returnBtnH);
                 const inTip = p.tipX ? (p.tipX > returnBtnX && p.tipX < returnBtnX + returnBtnW && p.tipY > returnBtnY && p.tipY < returnBtnY + returnBtnH) : false;
                 return inPalm || inTip;
             };
             if (check(leftPalm) || check(rightPalm)) {
                if(this.backProg === 0) playSound('hover');
                this.backProg += 2.2;
                if(this.backProg >= 100) { playSound('start'); this.backProg = 0; initMenuMain(); }
             } else {
                if(this.backProg) this.backProg = Math.max(0, this.backProg - 3);
             }
           }
         } else if (gameState === "gameover") {
            // ================= 게임 오버 화면 (결계 붕괴 보고서) =================
            canvasCtx.fillStyle = 'rgba(22, 4, 4, 0.92)';
            canvasCtx.fillRect(0, 0, width, height);

            const docW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(width * 0.76, 880);
            const docH = isPortrait ? height * 0.92 : height * 0.88;
            const docX = width / 2 - docW / 2;
            const docY = isPortrait ? height * 0.04 : height * 0.06;
            drawParchmentScroll(canvasCtx, docX, docY, docW, docH, "결계 붕괴 보고서");

            canvasCtx.save();
            canvasCtx.textAlign = 'center';

            // 패배 타이틀
            canvasCtx.font = `bold ${Math.floor(docH * 0.075)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#b71c1c';
            canvasCtx.shadowColor = '#ff2200';
            canvasCtx.shadowBlur = 14;
            canvasCtx.fillText("결계 붕괴 - 패배 (GAME OVER)", width/2, docY + docH * 0.18, docW * 0.88);

            canvasCtx.font = `bold ${Math.floor(docH * 0.042)}px 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#5c1212';
            canvasCtx.shadowBlur = 0;
            canvasCtx.fillText("보스의 공격으로 결계 HP가 완전히 소진되었습니다.", width/2, docY + docH * 0.27, docW * 0.88);

            // 진행 결과 통계
            canvasCtx.font = `bold ${Math.floor(docH * 0.048)}px 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#2c1808';
            canvasCtx.fillText(`해결한 문제: ${questionCount} / ${MAX_QUESTIONS_PER_LEVEL}  |  오답: ${totalWrongCount}회`, width/2, docY + docH * 0.38, docW * 0.88);

            const surviveSec = Math.max(1, (Date.now() - startTime) / 1000);
            canvasCtx.font = `bold ${Math.floor(docH * 0.048)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.fillStyle = '#0f4c81';
            canvasCtx.fillText(`버틴 시간: ${surviveSec.toFixed(1)} 초  |  최고 콤보: ${maxCombo}`, width/2, docY + docH * 0.47, docW * 0.88);

            // 두 개의 버튼: [ 다시 도전 ] & [ 아카데미로 복귀 ]
            const btnW = isPortrait ? Math.min(docW * 0.44, 180) : Math.min(docW * 0.40, 260);
            const btnH = isPortrait ? Math.min(48, docH * 0.08) : docH * 0.09;
            const gap = isPortrait ? 8 : 15;
            const retryBtnX = width / 2 - btnW - gap;
            const retryBtnY = docY + docH * (isPortrait ? 0.78 : 0.72);
            const menuBtnX = width / 2 + gap;
            const menuBtnY = retryBtnY;

            if (!window.retryProg) window.retryProg = 0;
            if (!window.menuProg) window.menuProg = 0;

            // 다시 도전 버튼
            canvasCtx.fillStyle = '#3e1d10';
            canvasCtx.fillRect(retryBtnX, retryBtnY, btnW, btnH);
            if (window.retryProg > 0) {
              canvasCtx.fillStyle = 'rgba(0, 230, 255, 0.5)';
              canvasCtx.fillRect(retryBtnX, retryBtnY, btnW * (window.retryProg / 100), btnH);
            }
            canvasCtx.strokeStyle = '#ffd700';
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeRect(retryBtnX, retryBtnY, btnW, btnH);
            canvasCtx.fillStyle = '#ffe082';
            canvasCtx.font = `bold ${Math.floor(btnH * 0.42)}px 'Cinzel', 'Gowun Batang', serif`;
            canvasCtx.textBaseline = 'middle';
            canvasCtx.fillText("다시 도전", retryBtnX + btnW / 2, retryBtnY + btnH / 2);

            // 아카데미로 복귀 버튼
            canvasCtx.fillStyle = '#3e1d10';
            canvasCtx.fillRect(menuBtnX, menuBtnY, btnW, btnH);
            if (window.menuProg > 0) {
              canvasCtx.fillStyle = 'rgba(255, 120, 0, 0.5)';
              canvasCtx.fillRect(menuBtnX, menuBtnY, btnW * (window.menuProg / 100), btnH);
            }
            canvasCtx.strokeStyle = '#ffd700';
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeRect(menuBtnX, menuBtnY, btnW, btnH);
            canvasCtx.fillStyle = '#ffe082';
            canvasCtx.fillText("아카데미로 복귀", menuBtnX + btnW / 2, menuBtnY + btnH / 2);
            canvasCtx.restore();

            if (results.poseLandmarks) {
              const leftPalm = getPalm(results.poseLandmarks, true, width, height);
              const rightPalm = getPalm(results.poseLandmarks, false, width, height);
              const checkR = (p) => p && (p.x > retryBtnX && p.x < retryBtnX + btnW && p.y > retryBtnY && p.y < retryBtnY + btnH);
              const checkM = (p) => p && (p.x > menuBtnX && p.x < menuBtnX + btnW && p.y > menuBtnY && p.y < menuBtnY + btnH);

              if (checkR(leftPalm) || checkR(rightPalm)) {
                if (window.retryProg === 0) playSound('hover');
                window.retryProg += 2.5;
                if (window.retryProg >= 100) {
                  window.retryProg = 0;
                  playSound('start');
                  startGame(currentSubLevel);
                  return;
                }
              } else {
                window.retryProg = Math.max(0, window.retryProg - 3);
              }

              if (checkM(leftPalm) || checkM(rightPalm)) {
                if (window.menuProg === 0) playSound('hover');
                window.menuProg += 2.5;
                if (window.menuProg >= 100) {
                  window.menuProg = 0;
                  playSound('start');
                  initMenuMain();
                  return;
                }
              } else {
                window.menuProg = Math.max(0, window.menuProg - 3);
              }
            }
         }
        renderCursors(results, canvasCtx, width, height);
        return;
      }

      // ================= 3D 투시 원근 그리드 바닥 =================
      // 달릴 때만 그리드 이동, 그 외에는 스무스하게 정지
      const gridTargetSpeed = (gameState === "running") ? (4.2 * runMultiplier) : 0;
      draw3DPerspectiveGrid(canvasCtx, width, height, gridTargetSpeed);

      // ================= 거대 보스 발밑 소환 마법진 =================
      drawBossSummoningCircle(canvasCtx, boss.x, boss.y + boss.size * 0.36, boss.size * 0.82, boss.size * 0.28);

      // ================= 거대 보스 몬스터 등장 =================
      boss.draw(canvasCtx, width, height);
      boss.drawHpBar(canvasCtx, width, height);

      // ================= 플레이어 체력(HP) 게이지 =================
      drawPlayerHpBar(canvasCtx, width, height);

      // ================= 미니언 러시 3D 디펜스 =================
      updateAndDrawMinions(canvasCtx, width, height);

      // ================= 오답 시 보스 대형 화염탄 화면 직격 =================
      updateAndDrawBossAttackFireball(canvasCtx, width, height);

      // ================= 잔여 마나 흡수 파티클 마무리 =================
      if (gameState !== "running" && manaGatherParticles.length > 0) {
        updateAndDrawManaGather(canvasCtx, width / 2, height * 0.80, false);
      }

      // ================= 플레이어 피격 비넷 =================
      drawPlayerHurtVignette(canvasCtx, width, height);

      // 프레임 델타 타임 계산
      const now = Date.now();
      const dt = Math.max(0.005, Math.min(0.08, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      // ================= 게임 시작 전 자세 가이드 페이즈 =================
      if (gameState === "ready_position") {
        drawPlayerPositionGuide(canvasCtx, width, height, results, dt);
        renderCursors(results, canvasCtx, width, height);
        return;
      }

      // 좌/우 상단 모서리 직각삼각형 정답 영역 (상단 25% 지점, 화면 좌우 75% 지점)
      const triW = isPortrait ? Math.round(width * 0.38) : Math.round(width * 0.25);
      const triH = isPortrait ? Math.round(height * 0.18) : Math.round(height * 0.25);

      const inLeftTri = (palm) => {
        if (!palm) return false;
        const check = (px, py) => {
          if (px < 0 || px > triW || py < 0 || py > triH) return false;
          return (px / triW + py / triH) <= 1.0;
        };
        return check(palm.x, palm.y) || (palm.tipX ? check(palm.tipX, palm.tipY) : false);
      };

      const inRightTri = (palm) => {
        if (!palm) return false;
        const check = (px, py) => {
          if (px < width - triW || px > width || py < 0 || py > triH) return false;
          return ((width - px) / triW + py / triH) <= 1.0;
        };
        return check(palm.x, palm.y) || (palm.tipX ? check(palm.tipX, palm.tipY) : false);
      };

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const wristL = lm[15];
        const wristR = lm[16];
        const elbowL = lm[13];
        const elbowR = lm[14];
        const shoulderL = lm[11];
        const shoulderR = lm[12];

        // ── 달리기 감지 (3가지 독립 요소, 가중치 분리) ──
        // ① 어깨 좌우 스윙  (가중치 1.0)
        // ② 어깨 위아래 변위 (가중치 1.0)
        // ③ 양손(손목) 교차 스윙 (가중치 0.5)
        // 목표: 일반 달리기 속도에서 5초 이상 달려야 게이지 100% 도달
        let armMotionEnergy = 0;
        if (window._prevMotionData && wristL && wristR && elbowL && elbowR && shoulderL && shoulderR) {
          // ① 어깨 좌우 스윙: 어깨 중심점의 X 이동량
          const sCenterX = (shoulderL.x + shoulderR.x) / 2;
          const dS_LR = Math.abs(sCenterX - window._prevMotionData.sCX);

          // ② 어깨 위아래: 어깨 중심점의 Y 이동량
          const sCenterY = (shoulderL.y + shoulderR.y) / 2;
          const dS_UD = Math.abs(sCenterY - window._prevMotionData.sCY);

          // ③ 양손 교차: 손목 X좌표가 서로 교차하는 변화량 (좌손이 우손보다 오른쪽이면 교차)
          const prevCross = window._prevMotionData.crossDiff;
          const curCross = wristL.x - wristR.x; // 양수면 왼손이 우측에
          const dCross = Math.abs(curCross - prevCross);

          // 노이즈 필터 후 가중치 합산 (서있을 때 카메라 미세 노이즈 차단 데드존 적용)
          const swing_LR = Math.max(0, dS_LR - 0.012) * 1.0;  // 어깨 좌우 데드존 (0.004 -> 0.012)
          const swing_UD = Math.max(0, dS_UD - 0.012) * 1.0;  // 어깨 위아래 데드존 (0.004 -> 0.012)
          const swing_CR = Math.max(0, dCross - 0.018) * 0.5; // 양손 교차 데드존 (0.006 -> 0.018)

          const rawMotion = swing_LR + swing_UD + swing_CR;
          // 가만히 서있을 때 미세 흔들림으로 인한 게이지 증가 100% 차단
          if (rawMotion > 0.008) {
            armMotionEnergy = (rawMotion - 0.008) * 45;
          } else {
            armMotionEnergy = 0; // 정지 상태 시 게이지 증가 안함!
          }
        }
        if (wristL && wristR && elbowL && elbowR && shoulderL && shoulderR) {
          window._prevMotionData = {
            wLx: wristL.x, wLy: wristL.y,
            wRx: wristR.x, wRy: wristR.y,
            eLx: elbowL.x, eLy: elbowL.y,
            eRx: elbowR.x, eRy: elbowR.y,
            sTilt: shoulderL.y - shoulderR.y,
            sCX: (shoulderL.x + shoulderR.x) / 2,
            sCY: (shoulderL.y + shoulderR.y) / 2,
            crossDiff: wristL.x - wristR.x
          };
        }

        if ((gameState === "running" || gameState === "playing") && armMotionEnergy > 0) {
          if (gameState === "running") {
            // gain 상한: 너무 빠른 동작에도 초당 최대 25 제한 (=4초 최소)
            const gain = Math.min(armMotionEnergy, 0.85);
            runGauge = Math.min(targetRunGauge + 1, runGauge + gain);
          }
          
          // 정답 선택 중(playing) 및 질주 중(running) 모두 제자리에서 달리면 아군 미니언 출격!
          minionSpawnTimer--;
          if (minionSpawnTimer <= 0) {
            spawnAlliedMinion();
            minionSpawnTimer = Math.floor(35 + Math.random() * 20); // 적 미니언과 1:1 밸런스!
          }
        }

        const leftPalm = getPalm(results.poseLandmarks, true, width, height);
        const rightPalm = getPalm(results.poseLandmarks, false, width, height);

        const isLeftHover = inLeftTri(leftPalm) || inLeftTri(rightPalm);
        const isRightHover = inRightTri(leftPalm) || inRightTri(rightPalm);

        if (gameState === "playing") {
          if (isLeftHover && !isRightHover) {
            if (leftDwellProgress === 0) playSound('hover');
            leftDwellProgress = Math.min(1.0, leftDwellProgress + dt / 0.5); // 0.5초 정답 인정
            rightDwellProgress = Math.max(0, rightDwellProgress - dt * 3.0);
          } else if (isRightHover && !isLeftHover) {
            if (rightDwellProgress === 0) playSound('hover');
            rightDwellProgress = Math.min(1.0, rightDwellProgress + dt / 0.5); // 0.5초 정답 인정
            leftDwellProgress = Math.max(0, leftDwellProgress - dt * 3.0);
          } else {
            leftDwellProgress = Math.max(0, leftDwellProgress - dt * 3.0);
            rightDwellProgress = Math.max(0, rightDwellProgress - dt * 3.0);
          }
        } else {
          leftDwellProgress = 0;
          rightDwellProgress = 0;
        }
      }

      // 전투 중 적군 미니언 주기적 출격 (적 미니언 시스템)
      if (gameState === "running" || gameState === "playing") {
        enemySpawnTimer--;
        if (enemySpawnTimer <= 0) {
          spawnEnemyMinion();
          enemySpawnTimer = Math.floor(40 + Math.random() * 30);
        }
      }

      if (gameState === "running") {
        runGauge -= 0.15; // 자연 감소 완화 (0.3→0.15), 멈춰도 급감하지 않음
        if (runGauge < 0) runGauge = 0;

        // 달리기 중 아군 미니언 지속 출격
        minionSpawnTimer--;
        if (minionSpawnTimer <= 0) {
          if (runGauge > 5) spawnAlliedMinion();
          minionSpawnTimer = Math.max(16, Math.floor(35 - runGauge * 0.2));
        }
        
        if (runGauge >= targetRunGauge) {
          runGauge = 0; 
          gameState = "playing";
          playingCooldownUntil = Date.now() + 500; // 전환 순간 즉시 판정 방지 쿨다운
          leftDwellProgress = 0;
          rightDwellProgress = 0;
        }
      }

      if (gameState === 'playing') {
        let triggerSide = null;
        if (leftDwellProgress >= 1.0) {
          triggerSide = "left";
          leftDwellProgress = 0;
          rightDwellProgress = 0;
        } else if (rightDwellProgress >= 1.0) {
          triggerSide = "right";
          leftDwellProgress = 0;
          rightDwellProgress = 0;
        }

        if (triggerSide && Date.now() >= playingCooldownUntil) {
          const selectedSide = triggerSide;
          lastHitSide = selectedSide;
          
          if (selectedSide === correctSide) {
            gameState = "correct";
            stateTimer = Date.now();
            score += 100;
            questionCount++;
            totalCorrectCount++;
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            runMultiplier = Math.max(1.0, runMultiplier - 0.5);
            targetRunGauge = 100 * runMultiplier;

            // 10문제 동안 보스 HP 정확히 차감 연동
            boss.hp = Math.max(0, MAX_QUESTIONS_PER_LEVEL - questionCount);
            
            updateBGM(combo >= 3);

            // 오른손/오른쪽 선택: 파이어볼, 왼손/왼쪽 선택: 냉기폭발
            const spellType = (selectedSide === 'right') ? 'fireball' : 'frostblast';
            
            // [정답 특수 연출] 문제가 바스라져 삼각 영역으로 수렴 후 보스에게 마법 발사!
            const targetCornerX = (selectedSide === 'left') ? triW * 0.36 : width - triW * 0.36;
            const targetCornerY = triH * 0.36;
            const qBoxW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(width * 0.78, 860);
            const qBoxH = Math.max(isPortrait ? height * 0.14 : height * 0.16, currentBannerHeight || 120);
            const qBoxY = isPortrait ? height * 0.45 : height * 0.48;
            startQuestionShatter(questionText, width / 2, qBoxY + qBoxH * 0.5, qBoxW, qBoxH, targetCornerX, targetCornerY, selectedSide === 'left', spellType, combo);
            spawnAlliedMinionWave(3); // 승리의 아군 미니언 돌진 러시 (적군과 1:1 밸런스 조정)

            if (combo >= 3) {
              playSound('combo');
              createParticles(targetCornerX, targetCornerY, true);
              canvasElement.classList.remove('shake-normal', 'shake-heavy');
              void canvasElement.offsetWidth;
              canvasElement.classList.add('shake-heavy');
            } else {
              playSound('correct');
              createParticles(targetCornerX, targetCornerY, false);
              canvasElement.classList.remove('shake-normal', 'shake-heavy');
              void canvasElement.offsetWidth;
              canvasElement.classList.add('shake-normal');
            }
            
            if (questionCount >= MAX_QUESTIONS_PER_LEVEL) {
               endTime = Date.now();
               saveRecord(currentLevel, currentSubLevel, ((endTime - startTime)/1000).toFixed(2));
               setTimeout(() => { stopBGM(); gameState = "result"; }, 1500);
               return;
            }
          } else {
            // [오답 특수 연출] 문제가 푸스스 재와 연기로 사라짐
            gameState = "wrong";
            stateTimer = Date.now();
            score = Math.max(0, score - 50);
            combo = 0; 
            totalWrongCount++;
            updateBGM(false); 
            runMultiplier = Math.min(3.0, runMultiplier + 0.5);
            targetRunGauge = 100 * runMultiplier;
            playSound('wrong');

            const qBoxW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(width * 0.78, 860);
            const qBoxH = Math.max(isPortrait ? height * 0.14 : height * 0.16, currentBannerHeight || 120);
            const qBoxY = isPortrait ? height * 0.45 : height * 0.48;
            startQuestionFizzle(questionText, width / 2, qBoxY + qBoxH * 0.5, qBoxW, qBoxH);

            // [오답 시 보스 대형 화염탄 반격 직격]
            bossAttackFireball = { x: boss.x, y: boss.y, progress: 0, speed: 0.055 };
          }
          setTimeout(() => { 
            if (gameState !== "result" && gameState !== "gameover") { 
               generateQuestion(); 
               gameState = "running"; 
            } 
          }, 1500);
        }
      }

      // ================= 상단 HUD (화면 꽉 채운 8% 높이 양피지 스크롤 바) =================
      const hudW = width;
      const hudH = Math.round(height * 0.08);
      const hudX = 0;
      const hudY = 0;
      drawParchmentScroll(canvasCtx, hudX, hudY, hudW, hudH);

      canvasCtx.save();
      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';

      let titleStr = `${getLevelTitle(currentLevel)} - ${getSubTitle(currentLevel, currentSubLevel)}`;
      canvasCtx.font = `bold ${Math.floor(hudH * 0.38)}px 'Cinzel', 'Gowun Batang', serif`;
      canvasCtx.fillStyle = '#3a1f0a';
      canvasCtx.shadowColor = 'rgba(255, 230, 180, 0.8)';
      canvasCtx.shadowBlur = 3;
      canvasCtx.fillText(`[ ${titleStr} ]`, width / 2, hudY + hudH * 0.32, hudW * 0.95);

      canvasCtx.font = `bold ${Math.floor(hudH * 0.30)}px 'Cinzel', 'Gowun Batang', serif`;
      canvasCtx.fillStyle = '#5c3311';
      canvasCtx.fillText(`점수: ${score}  |  콤보: ${combo}(최고:${maxCombo})  |  ${((Date.now() - startTime)/1000).toFixed(1)}s`, width / 2, hudY + hudH * 0.72, hudW * 0.95);
      canvasCtx.restore();

      // ================= 일시 정지 버튼 (우측 하단) =================
      // ================= 일시 정지 버튼 (우측 하단 나머지 영역 이등변 직각삼각형) =================
      if (gameState === "running" || gameState === "playing") {
          const hpBarW = isPortrait ? Math.min(width * 0.72, 340) : Math.max(300, Math.min(520, width * 0.42));
          const hpBarRight = width / 2 + hpBarW / 2;
          const remainingSpace = width - hpBarRight;
          const legSize = isPortrait 
            ? Math.max(75, Math.min(Math.round(width * 0.23), Math.round(height * 0.11)))
            : Math.max(120, Math.min(230, Math.round(Math.min(height * 0.22, remainingSpace - 12))));

          const checkPauseHover = (palm) => {
              if (!palm) return false;
              const check = (px, py) => {
                if (px < width - legSize || px > width || py < height - legSize || py > height) return false;
                return ((width - px) + (height - py)) <= legSize;
              };
              return check(palm.x, palm.y) || (palm.tipX ? check(palm.tipX, palm.tipY) : false);
          };

          let pLeft = results.poseLandmarks ? getPalm(results.poseLandmarks, true, width, height) : null;
          let pRight = results.poseLandmarks ? getPalm(results.poseLandmarks, false, width, height) : null;
          if (checkPauseHover(pLeft) || checkPauseHover(pRight)) {
              if(!window.pauseHoverProgress) window.pauseHoverProgress = 0;
              if(window.pauseHoverProgress === 0) playSound('hover');
              window.pauseHoverProgress += 4;
              if (window.pauseHoverProgress >= 100) {
                  window.pauseHoverProgress = 0;
                  playSound('start');
                  previousGameState = gameState;
                  gameState = "paused";
                  stopBGM();
                  return; 
              }
          } else {
              if(window.pauseHoverProgress) window.pauseHoverProgress = Math.max(0, window.pauseHoverProgress - 3);
          }

          canvasCtx.save();
          // 이등변 직각삼각형 경로: (width, height) -> (width, height - legSize) -> (width - legSize, height)
          canvasCtx.beginPath();
          canvasCtx.moveTo(width, height);
          canvasCtx.lineTo(width, height - legSize);
          canvasCtx.lineTo(width - legSize, height);
          canvasCtx.closePath();

          canvasCtx.fillStyle = 'rgba(25, 12, 6, 0.88)';
          canvasCtx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          canvasCtx.shadowBlur = 12;
          canvasCtx.fill();

          if (window.pauseHoverProgress) {
              const pRatio = Math.min(1.0, window.pauseHoverProgress / 100);
              const fillLeg = legSize * Math.sqrt(pRatio);
              canvasCtx.save();
              canvasCtx.beginPath();
              canvasCtx.moveTo(width, height);
              canvasCtx.lineTo(width, height - fillLeg);
              canvasCtx.lineTo(width - fillLeg, height);
              canvasCtx.closePath();
              canvasCtx.fillStyle = 'rgba(255, 75, 0, 0.65)';
              canvasCtx.shadowColor = '#ff5500';
              canvasCtx.shadowBlur = 18;
              canvasCtx.fill();
              canvasCtx.restore();
          }

          canvasCtx.strokeStyle = '#ffd700';
          canvasCtx.lineWidth = 3.5;
          canvasCtx.shadowColor = window.pauseHoverProgress > 0 ? '#ff8800' : 'rgba(0, 0, 0, 0.8)';
          canvasCtx.shadowBlur = window.pauseHoverProgress > 0 ? 16 : 6;
          canvasCtx.stroke();

          // 빗변 강조
          canvasCtx.beginPath();
          canvasCtx.moveTo(width, height - legSize);
          canvasCtx.lineTo(width - legSize, height);
          canvasCtx.strokeStyle = window.pauseHoverProgress > 0 ? '#ffdd00' : '#ffe8a3';
          canvasCtx.lineWidth = 2.5;
          canvasCtx.stroke();

          // 텍스트 ("⏸ 멈추기") 무게중심 배치
          const tX = width - legSize * 0.36;
          const tY = height - legSize * 0.36;
          canvasCtx.fillStyle = '#ffe082';
          canvasCtx.font = `bold ${Math.max(16, Math.floor(legSize * 0.16))}px 'Cinzel', 'Gowun Batang', serif`;
          canvasCtx.textAlign = 'center';
          canvasCtx.textBaseline = 'middle';
          canvasCtx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          canvasCtx.shadowBlur = 8;
          canvasCtx.fillText("⏸ 멈추기", tX, tY);
          canvasCtx.restore();
      }

      // ================= 달리기 (질주 & 마나 충전) 페이즈 =================
      if (gameState === "running") {
        let p = runGauge / targetRunGauge;
        let scale = Math.max(0.02, Math.pow(p, 3)); 
        let qY = (height * (isPortrait ? 0.45 : 0.48)) + ((height * (isPortrait ? 0.36 : 0.38)) - (height * (isPortrait ? 0.45 : 0.48))) * p;
        
        canvasCtx.save();
        canvasCtx.translate(width/2, qY);
        canvasCtx.scale(scale, scale);
        
        let qInfoRun = renderWrappedQuestion(canvasCtx, questionText, 0, 0, isPortrait ? width * 0.90 : width * 0.84, Math.floor(height * (isPortrait ? 0.08 : 0.10)), false);

        if (questionShape) {
            let shapeCenterY = 0;
            if (qInfoRun.lines.length > 1) {
                shapeCenterY -= (qInfoRun.totalH / 2 + 15);
            }
            canvasCtx.save();
            canvasCtx.translate(0, shapeCenterY);
            drawShapeData(canvasCtx, questionShape);
            canvasCtx.restore();
        }
        
        canvasCtx.font = `bold ${Math.floor(height* (isPortrait ? 0.048 : 0.06))}px 'Cinzel', 'Gowun Batang', serif`;
        canvasCtx.fillStyle = '#ffe89e';
        canvasCtx.shadowColor = '#ffd700';
        canvasCtx.shadowBlur = 8;
        let ansY = Math.max(height * 0.1, qInfoRun.totalH / 2 + qInfoRun.fontSize * 0.9);
        canvasCtx.fillText(`[ ${leftAnswerText} ]      [ ${rightAnswerText} ]`, 0, ansY);
        canvasCtx.restore();

        // 연금술 마나 플라스크 게이지 바
        const barWidth = isPortrait ? Math.min(width * 0.88, 440) : Math.min(width * 0.50, 560);
        const barHeight = isPortrait ? Math.max(26, height * 0.042) : Math.max(28, height * 0.052);
        const barX = width / 2 - barWidth / 2;
        const barY = isPortrait ? height * 0.76 : height * 0.80;
        let fillRatio = Math.min(1.0, runGauge / targetRunGauge);
        updateAndDrawManaGather(canvasCtx, barX + barWidth * fillRatio, barY + barHeight / 2, true);
        drawManaFlaskGauge(canvasCtx, barX, barY, barWidth, barHeight, fillRatio, runMultiplier);

        canvasCtx.save();
        canvasCtx.fillStyle = '#ffe082';
        canvasCtx.font = `bold ${Math.floor(height* (isPortrait ? 0.038 : 0.045))}px 'Cinzel', 'Gowun Batang', serif`;
        canvasCtx.textAlign = 'center';
        canvasCtx.textBaseline = 'alphabetic';
        canvasCtx.shadowColor = '#ff8800';
        canvasCtx.shadowBlur = 12;
        canvasCtx.fillText("제자리에서 달려 아군 미니언을 출격시키세요!", width / 2, barY - height * 0.025);
        if (runMultiplier > 1.0) {
          canvasCtx.fillStyle = '#ff4444';
          canvasCtx.font = `bold ${Math.floor(height*0.035)}px 'Gowun Batang', serif`;
          canvasCtx.fillText(`오답 패널티! ${runMultiplier}배 더 뛰어야 합니다!`, width / 2, barY + barHeight + height * 0.035);
        }
        canvasCtx.restore();

      } else if (gameState === "playing") {
        // ================= 문제 플레이 페이즈 =================
        // 정답/오답으로 파편이 날아가거나 재로 변하는 중이 아니면 자연스러운 천 현수막 렌더링
        if (questionShatterParticles.length === 0 && questionFizzleParticles.length === 0) {
          const testFont = isPortrait ? Math.floor(height * 0.040) : Math.floor(height * 0.054);
          const maxTextW = isPortrait ? Math.min(width * 0.88, 420) : Math.min(width * 0.70, 780);
          const qInfoTest = renderWrappedQuestion(canvasCtx, questionText, 0, 0, maxTextW, testFont, false);
          const lineCount = (qInfoTest && qInfoTest.lines) ? qInfoTest.lines.length : 1;
          const textH = lineCount * testFont * 1.32;
          const shapeH = questionShape ? (isPortrait ? 90 : 120) : 0;
          const padY = isPortrait ? 40 : 55;

          const qBoxW = isPortrait ? Math.min(width * 0.94, 460) : Math.min(width * 0.78, 860);
          const qBoxH = Math.max(isPortrait ? height * 0.14 : height * 0.16, textH + shapeH + padY);
          currentBannerHeight = qBoxH;
          const qBoxX = width / 2 - qBoxW / 2;
          const qBoxY = isPortrait ? height * 0.45 : height * 0.48; // 화면 정중앙보다 약간 아래쪽에 배치!

          drawClothBanner(canvasCtx, qBoxX, qBoxY, qBoxW, qBoxH);

          let textStartY = qBoxY + qBoxH * 0.52;
          if (questionShape) {
            textStartY += shapeH * 0.35;
          }
          let qInfoPlay = renderWrappedQuestion(canvasCtx, questionText, width / 2, textStartY, maxTextW, testFont);

          if (questionShape) {
            canvasCtx.save();
            let shapeCenterY = qBoxY + (isPortrait ? 38 : 50) + shapeH * 0.4;
            canvasCtx.translate(width / 2, shapeCenterY); 
            drawShapeData(canvasCtx, questionShape);
            canvasCtx.restore();
          }
        }

        // 안내 문구 (크로스 펀치 완전 제거)
        canvasCtx.save();
        canvasCtx.textAlign = 'center';
        canvasCtx.fillStyle = '#ffe082';
        canvasCtx.font = `bold ${Math.floor(height * (isPortrait ? 0.026 : 0.034))}px 'Cinzel', 'Gowun Batang', serif`;
        canvasCtx.shadowColor = '#00ffcc';
        canvasCtx.shadowBlur = 8;
        canvasCtx.fillText("양끝 삼각 영역에 손을 0.5초간 올려 정답을 선택하세요!", width / 2, isPortrait ? height * 0.41 : height * 0.43);
        canvasCtx.restore();

        // 좌/우 상단 모서리 직각삼각형 정답 영역 (0.5초 Dwell 충전)
        drawCornerAnswerZone(canvasCtx, width, height, leftAnswerText, true, leftDwellProgress, lastHitSide === 'left', gameState === 'correct');
        drawCornerAnswerZone(canvasCtx, width, height, rightAnswerText, false, rightDwellProgress, lastHitSide === 'right', gameState === 'correct');

      } else if (gameState === 'correct') {
        canvasCtx.save();
        let elapsed = Date.now() - stateTimer;
        let iconScale = Math.min(1.0, elapsed / 180.0);

        // 주문 성공 기본 텍스트
        canvasCtx.fillStyle = '#ffe082';
        canvasCtx.font = `bold ${Math.floor(height*0.065)}px 'Cinzel', 'Gowun Batang', serif`;
        canvasCtx.textAlign = 'center';
        canvasCtx.textBaseline = 'middle';
        canvasCtx.shadowColor = '#00ffcc';
        canvasCtx.shadowBlur = 18;
        canvasCtx.fillText("주문 영창 성공!", width / 2, height * 0.49);

        // 2콤보 이상일 때 화면 중앙에 화려한 연속 콤보 배너 표시
        if (combo >= 2) {
          canvasCtx.save();
          const comboPulse = 1.0 + Math.sin(elapsed * 0.015) * 0.08;
          canvasCtx.translate(width / 2, height * 0.56);
          canvasCtx.scale(comboPulse, comboPulse);
          canvasCtx.font = `bold ${Math.floor(height * (combo >= 3 ? 0.080 : 0.062))}px 'Cinzel', 'Gowun Batang', serif`;
          const comboGrad = canvasCtx.createLinearGradient(-160, 0, 160, 0);
          comboGrad.addColorStop(0, '#ff4500');
          comboGrad.addColorStop(0.5, '#ffd700');
          comboGrad.addColorStop(1, '#ff2200');
          canvasCtx.fillStyle = comboGrad;
          canvasCtx.shadowColor = '#ff2200';
          canvasCtx.shadowBlur = 25;
          canvasCtx.fillText(`${combo} COMBO! 연속 영창!`, 0, 0);
          canvasCtx.restore();
        }

        let targetX = lastHitSide === 'left' ? triW * 0.5 : width - triW * 0.5;
        let targetY = triH * 0.5;

        canvasCtx.translate(targetX, targetY);
        canvasCtx.scale(iconScale, iconScale);
        let baseId = combo >= 3 ? 'img_combo' : 'img_correct';
        let img = document.getElementById(baseId);
        if (img) canvasCtx.drawImage(img, -triW * 0.35, -triH * 0.35, triW * 0.7, triH * 0.7);
        canvasCtx.restore();

      } else if (gameState === 'wrong') {
        canvasCtx.save();
        canvasCtx.fillStyle = '#ff3333';
        canvasCtx.font = `bold ${Math.floor(height*0.08)}px 'Cinzel', 'Gowun Batang', serif`;
        canvasCtx.textAlign = 'center';
        canvasCtx.textBaseline = 'middle';
        canvasCtx.shadowColor = '#ff0000';
        canvasCtx.shadowBlur = 20;
        canvasCtx.fillText("주문 불발! (푸스스...)", width / 2, height * 0.53);

        let elapsed = Date.now() - stateTimer;
        let targetX = lastHitSide === 'left' ? triW * 0.5 : width - triW * 0.5;
        let targetY = triH * 0.5;
        let shake = Math.sin(elapsed / 20) * 15;

        canvasCtx.translate(targetX + shake, targetY);
        let img = document.getElementById('img_wrong');
        if (img) canvasCtx.drawImage(img, -triW * 0.35, -triH * 0.35, triW * 0.7, triH * 0.7);
        canvasCtx.restore();
      }

      // 판타지 스펠 & 파편 효과 렌더링
      updateAndDrawFantasyEffects(canvasCtx);
      updateAndDrawParticles(canvasCtx);
      renderCursors(results, canvasCtx, width, height);
      return;
    }

    let hitParticles = [];
    function createParticles(x, y, isCombo) {
        hitParticles = [];
        hitParticles.push({ type: 'shockwave', x, y, radius: 10, maxRadius: isCombo ? 600 : 300, alpha: 1.0, speed: isCombo ? 40 : 20 });
        const numSparks = isCombo ? 40 : 15;
        for (let i = 0; i < numSparks; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (isCombo ? 30 : 15) + 5;
            hitParticles.push({
                type: 'spark', x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                life: 1.0, decay: Math.random() * 0.05 + 0.02,
                color: isCombo ? pick(['#FF0000', '#FF8800', '#FFFF00', '#FFFFFF']) : pick(['#00FF00', '#FFFFFF', '#00FFFF']),
                size: Math.random() * (isCombo ? 15 : 8) + 5
            });
        }
        if (isCombo) {
            for(let i=0; i<16; i++) {
                const angle = (i / 16) * Math.PI * 2 + Math.random()*0.1;
                hitParticles.push({ type: 'line', x, y, angle, dist: 50, length: 150, life: 1.0, decay: 0.04 });
            }
        }
    }

    function createFireImpactParticles(x, y, isCombo) {
        hitParticles = [];
        hitParticles.push({
            type: 'shockwave', x, y, radius: 10,
            maxRadius: isCombo ? 650 : 350, alpha: 1.0, speed: isCombo ? 42 : 22,
            color: 'rgba(255, 70, 0, '
        });
        const numSparks = isCombo ? 55 : 28;
        for (let i = 0; i < numSparks; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (isCombo ? 30 : 18) + 4;
            hitParticles.push({
                type: 'spark', x, y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 1.0, decay: Math.random() * 0.04 + 0.018,
                color: Math.random() > 0.5 ? '#ff3300' : (Math.random() > 0.5 ? '#ffaa00' : '#ffffff'),
                size: Math.random() * (isCombo ? 15 : 9) + 4
            });
        }
    }

    function createFrostImpactParticles(x, y, isCombo) {
        hitParticles = [];
        hitParticles.push({
            type: 'shockwave', x, y, radius: 10,
            maxRadius: isCombo ? 650 : 350, alpha: 1.0, speed: isCombo ? 40 : 20,
            color: 'rgba(0, 229, 255, '
        });
        const numCrystals = isCombo ? 55 : 28;
        for (let i = 0; i < numCrystals; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (isCombo ? 28 : 16) + 4;
            hitParticles.push({
                type: 'crystal', x, y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                size: Math.random() * (isCombo ? 14 : 9) + 4,
                rot: Math.random() * Math.PI * 2,
                vrot: (Math.random() - 0.5) * 0.25,
                life: 1.0, decay: Math.random() * 0.03 + 0.015,
                color: Math.random() > 0.5 ? '#00e5ff' : (Math.random() > 0.5 ? '#bbf2f6' : '#ffffff')
            });
        }
    }

    function updateAndDrawParticles(ctx) {
        for (let i = hitParticles.length - 1; i >= 0; i--) {
            let p = hitParticles[i];
            if (p.type === 'shockwave') {
                p.radius += p.speed;
                p.alpha -= (p.speed / p.maxRadius);
                if (p.alpha <= 0) { hitParticles.splice(i, 1); continue; }
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                ctx.lineWidth = 15 * p.alpha;
                ctx.strokeStyle = p.color ? (p.color + p.alpha + ')') : `rgba(255, 255, 255, ${p.alpha})`;
                ctx.shadowColor = p.color ? '#00ffff' : '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.restore();
            } else if (p.type === 'spark') {
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) { hitParticles.splice(i, 1); continue; }
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.restore();
            } else if (p.type === 'crystal') {
                p.x += p.vx; p.y += p.vy;
                p.rot += p.vrot;
                p.life -= p.decay;
                if (p.life <= 0) { hitParticles.splice(i, 1); continue; }
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.moveTo(0, -p.size * 1.2);
                ctx.lineTo(p.size * 0.8, 0);
                ctx.lineTo(0, p.size * 1.2);
                ctx.lineTo(-p.size * 0.8, 0);
                ctx.closePath();
                ctx.fillStyle = p.color;
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.restore();
            } else if (p.type === 'line') {
                p.dist += 20;
                p.life -= p.decay;
                if (p.life <= 0) { hitParticles.splice(i, 1); continue; }
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.beginPath();
                ctx.moveTo(p.dist, 0);
                ctx.lineTo(p.dist + p.length, 0);
                ctx.lineWidth = 8 * p.life;
                ctx.strokeStyle = `rgba(255, 255, 0, ${p.life})`;
                ctx.stroke();
                ctx.restore();
            }
        }
    }


    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: { ideal: 720 },
      height: { ideal: 1280 },
      facingMode: 'user'
    });
    camera.start();
  </script>
</body>
</html>
