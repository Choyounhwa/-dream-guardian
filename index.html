        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.strokeStyle = '#ff3300';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        // 발광 주황/노란 안광 (적군 눈)
        ctx.fillStyle = '#ffff00';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(-es * 0.10, -es * 0.44, es * 0.08, es * 0.07, 0, 0, Math.PI * 2);
        ctx.ellipse(es * 0.10, -es * 0.44, es * 0.08, es * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();

        // 적군 머리 뿔 (Horn Spikes)
        ctx.fillStyle = '#ff4500';
        ctx.beginPath();
        // 좌 측 뿔
        ctx.moveTo(-es * 0.22, -es * 0.55);
        ctx.lineTo(-es * 0.36, -es * 0.88);
        ctx.lineTo(-es * 0.08, -es * 0.65);
        // 우 측 뿔
        ctx.moveTo(es * 0.22, -es * 0.55);
        ctx.lineTo(es * 0.36, -es * 0.88);
        ctx.lineTo(es * 0.08, -es * 0.65);
        ctx.closePath();
        ctx.fill();

        // 손에 든 화염 삼지창 / 단검
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-es * 0.28, -es * 0.1);
        ctx.lineTo(-es * 0.28, -es * 0.82);
        ctx.stroke();

        ctx.fillStyle = '#ff3300';
        ctx.beginPath();
        ctx.arc(-es * 0.28, -es * 0.82, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // ==========================================
    // 오답 시 보스 대형 화염탄 화면 직격 이펙트
    // ==========================================
    let bossAttackFireball = null;
    function updateAndDrawBossAttackFireball(ctx, width, height) {
      if (!bossAttackFireball) return;
      bossAttackFireball.progress += bossAttackFireball.speed;
      const p = bossAttackFireball.progress;

      const curX = boss.x + (width / 2 - boss.x) * p;
      const curY = boss.y + (height * 0.55 - boss.y) * p;
      const curSize = 25 + Math.pow(p, 2.5) * (Math.min(width, height) * 0.55);

      ctx.save();
      const fireGrad = ctx.createRadialGradient(curX, curY, curSize * 0.1, curX, curY, curSize);
      fireGrad.addColorStop(0, '#ffffff');
      fireGrad.addColorStop(0.2, '#ffdd44');
      fireGrad.addColorStop(0.5, '#ff4400');
      fireGrad.addColorStop(0.85, 'rgba(180, 20, 0, 0.75)');
      fireGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
      ctx.fillStyle = fireGrad;
      ctx.shadowColor = '#ff2200';
      ctx.shadowBlur = 35;
      ctx.beginPath();
      ctx.arc(curX, curY, curSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (p >= 1.0) {
        playerHp = Math.max(0, playerHp - 25);
        playerHurtTimer = 35;
        playSound('fire_explode');
        createFireImpactParticles(width / 2, height * 0.55, true);
        canvasElement.classList.remove('shake-normal', 'shake-heavy');
        void canvasElement.offsetWidth;
        canvasElement.classList.add('shake-heavy');
        bossAttackFireball = null;
      }
    }

    // ==========================================
    // 플레이어 체력(HP) 게이지 (하단 중앙 배치)
    // ==========================================
    let playerHp = 100;
    let playerMaxHp = 100;
    let displayPlayerHp = 100;
    let playerHurtTimer = 0;

    function drawPlayerHpBar(ctx, width, height) {
      displayPlayerHp += (playerHp - displayPlayerHp) * 0.15;
      const isPortrait = height > width;
      const barW = isPortrait ? Math.min(width * 0.64, 270) : Math.min(width * 0.36, 380);
      const barH = isPortrait ? Math.max(22, height * 0.032) : Math.max(24, height * 0.034);
      const legSpace = isPortrait ? Math.max(75, Math.round(width * 0.22)) : 0;
      const barX = isPortrait ? (width - legSpace * 0.7) / 2 - barW / 2 : width / 2 - barW / 2;
      const barY = height - barH - (isPortrait ? 12 : 18);

      ctx.save();
      // 앤틱 프레임 외곽 음영
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#101a14';
      ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);

      ctx.fillStyle = 'rgba(10, 30, 20, 0.9)';
      ctx.fillRect(barX, barY, barW, barH);

      // 에메랄드/루비 체력 채우기
      const fillRatio = Math.max(0, Math.min(1, displayPlayerHp / playerMaxHp));
      const hpGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
      if (fillRatio > 0.4) {
        hpGrad.addColorStop(0, '#7bf1a8');
        hpGrad.addColorStop(0.5, '#10b981');
        hpGrad.addColorStop(1, '#047857');
      } else {
        hpGrad.addColorStop(0, '#f87171');
        hpGrad.addColorStop(0.5, '#ef4444');
        hpGrad.addColorStop(1, '#991b1b');
      }
      ctx.fillStyle = hpGrad;
      ctx.fillRect(barX, barY, barW * fillRatio, barH);

      // 황금 테두리
      ctx.strokeStyle = playerHurtTimer > 0 ? '#ff3333' : '#ffd700';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(barX, barY, barW, barH);

      // 텍스트 표기
      ctx.font = `bold ${Math.floor(barH * 0.62)}px 'Cinzel', 'Gowun Batang', serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 6;
      const hpText = (width < 450)
        ? `HP: ${Math.ceil(playerHp)} / ${playerMaxHp}`
        : `용사 결계 HP: ${Math.ceil(playerHp)} / ${playerMaxHp}`;
      ctx.fillText(hpText, barX + barW / 2, barY + barH / 2);

      ctx.restore();

      // 플레이어 체력 소진 시 게임 오버 처리
      if (playerHp <= 0 && gameState !== "gameover" && gameState !== "result" && gameState !== "menu_main" && gameState !== "menu_sub") {
        playerHp = 0;
        gameState = "gameover";
        stopBGM();
        playSound('wrong');
      }
    }

    function drawPlayerHurtVignette(ctx, width, height) {
      if (playerHurtTimer <= 0) return;
      playerHurtTimer--;
      ctx.save();
      const vAlpha = Math.min(0.70, (playerHurtTimer / 25) * 0.70);
      const vig = ctx.createRadialGradient(width / 2, height / 2, width * 0.3, width / 2, height / 2, width * 0.75);
      vig.addColorStop(0, 'rgba(255, 0, 0, 0)');
      vig.addColorStop(0.7, `rgba(255, 20, 0, ${vAlpha * 0.4})`);
      vig.addColorStop(1, `rgba(200, 0, 0, ${vAlpha})`);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    // ==========================================
    // 연금술 마나 플라스크 게이지 (달리기 충전 바)
    // ==========================================
    function drawManaFlaskGauge(ctx, barX, barY, barWidth, barHeight, fillRatio, runMultiplier) {
      ctx.save();
      const capW = 22;

      // 플라스크 외곽 그림자
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 14;

      // 유리 플라스크 배경
      ctx.fillStyle = 'rgba(10, 20, 25, 0.85)';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      // 차오르는 마나 액체 (피버/패널티 시 주황/빨강, 일반 시 에메랄드/시안)
      const liquidGrad = ctx.createLinearGradient(barX, barY, barX, barY + barHeight);
      if (runMultiplier > 1.0) {
        liquidGrad.addColorStop(0, '#ffcc00');
        liquidGrad.addColorStop(0.5, '#ff4500');
        liquidGrad.addColorStop(1, '#990000');
      } else {
        liquidGrad.addColorStop(0, '#b3fffc');
        liquidGrad.addColorStop(0.5, '#00e5ff');
        liquidGrad.addColorStop(1, '#0066aa');
      }
      ctx.fillStyle = liquidGrad;
      ctx.fillRect(barX, barY, barWidth * fillRatio, barHeight);

      // 기포 거품 연출
      for (let b = 0; b < 6; b++) {
        const bubbleX = barX + (barWidth * fillRatio) * ((b * 0.17 + Date.now() / 800) % 1.0);
        const bubbleY = barY + barHeight * 0.3 + Math.sin(Date.now() / 200 + b) * (barHeight * 0.25);
        ctx.beginPath();
        ctx.arc(bubbleX, bubbleY, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();
      }

      // 유리관 반사광
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect(barX, barY, barWidth, barHeight * 0.3);

      // 황금 캡 (좌/우 엔틱 마운트)
      const capGrad = ctx.createLinearGradient(0, barY, 0, barY + barHeight);
      capGrad.addColorStop(0, '#fff4b8');
      capGrad.addColorStop(0.5, '#d4af37');
      capGrad.addColorStop(1, '#5c3a00');
      ctx.fillStyle = capGrad;
      ctx.fillRect(barX - capW, barY - 4, capW, barHeight + 8);
      ctx.fillRect(barX + barWidth, barY - 4, capW, barHeight + 8);

      // 황금 테두리
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.strokeRect(barX, barY, barWidth, barHeight);

      ctx.restore();
    }

    // ==========================================
    // 손바닥 중심 및 손 크기 추정 (MediaPipe Pose 기반)
    // ==========================================
    // ==========================================
    // 손바닥 중심 및 손 크기 추정 (MediaPipe Pose 기반 + EMA 스무딩 & 외곽 클램핑)
    // ==========================================
    const palmSmoothers = {
      left: null,
      right: null
    };

    function resetPalmSmoothers() {
      palmSmoothers.left = null;
      palmSmoothers.right = null;
    }

    function getPalm(landmarks, isLeft, width, height) {
      if (!landmarks) return null;
      const key = isLeft ? 'left' : 'right';
      const prev = palmSmoothers[key];

      const wIdx = isLeft ? 15 : 16;
      const pIdx = isLeft ? 17 : 18;
      const iIdx = isLeft ? 19 : 20;
      const eIdx = isLeft ? 13 : 14;

      const w = landmarks[wIdx];

      // 외곽이나 화면 밖 근처로 나갈 때 visibility가 떨어지므로 기준을 완화(0.35 -> 0.18)하고,
      // 인식이 고갈되어도 10프레임 동안 이전 위치를 유지(Grace Period Hold)
      if (!w || w.visibility < 0.18) {
        if (prev && prev.lostCount < 10) {
          prev.lostCount++;
          return { ...prev.data, isHeld: true };
        }
        palmSmoothers[key] = null;
        return null;
      }

      const p = landmarks[pIdx];
      const idx = landmarks[iIdx];
      const e = landmarks[eIdx];

      let rx = w.x, ry = w.y;
      let handSpan = 0;

      if (idx && idx.visibility > 0.18 && p && p.visibility > 0.18) {
        rx = w.x * 0.35 + idx.x * 0.35 + p.x * 0.30;
        ry = w.y * 0.35 + idx.y * 0.35 + p.y * 0.30;
        handSpan = Math.hypot(w.x - idx.x, w.y - idx.y);
      } else if (idx && idx.visibility > 0.18) {
        rx = w.x * 0.45 + idx.x * 0.55;
        ry = w.y * 0.45 + idx.y * 0.55;
        handSpan = Math.hypot(w.x - idx.x, w.y - idx.y);
      } else if (e && e.visibility > 0.20) {
        const dx = w.x - e.x;
        const dy = w.y - e.y;
        const d = Math.hypot(dx, dy);
        if (d > 0.01) {
          rx = w.x + (dx / d) * (d * 0.25);
          ry = w.y + (dy / d) * (d * 0.25);
          handSpan = d * 0.38;
        }
      }

      let rawPx = (1.0 - rx) * width;
      let rawPy = ry * height;

      // 화면 테두리 클램핑 (외곽 진입 시 좌표 튐 방지)
      const margin = 10;
      const clampedPx = Math.max(margin, Math.min(width - margin, rawPx));
      const clampedPy = Math.max(margin, Math.min(height - margin, rawPy));

      const baseHandSize = handSpan > 0.02 ? handSpan * Math.min(width, height) * 1.85 : height * 0.09;
      const size = Math.max(48, Math.min(145, baseHandSize));

      const wandAngle = isLeft ? Math.PI * 0.16 : -Math.PI * 0.16;
      const headDist = size * 1.42;
      const rawTipX = clampedPx + Math.sin(wandAngle) * headDist;
      const rawTipY = clampedPy - Math.cos(wandAngle) * headDist;

      const clampedTipX = Math.max(margin, Math.min(width - margin, rawTipX));
      const clampedTipY = Math.max(margin, Math.min(height - margin, rawTipY));

      const currentData = {
        x: clampedPx,
        y: clampedPy,
        size: size,
        visibility: w.visibility,
        tipX: clampedTipX,
        tipY: clampedTipY
      };

      if (!prev) {
        palmSmoothers[key] = { data: currentData, lostCount: 0 };
        return currentData;
      }

      // EMA (지수 이동 평균) 필터링: 외곽 근처나 튐이 심할 때 반응속도를 조절하여 부드럽게 감쇄
      const dist = Math.hypot(currentData.x - prev.data.x, currentData.y - prev.data.y);
      let alpha = 0.30;
      
      if (dist > width * 0.12) {
        alpha = 0.10; // 갑자기 큰 좌표 튐이 들어오면 스무딩을 더 세게 적용
      } else if (dist < 5) {
        alpha = 0.45; // 미세한 조정은 빠르게 반응
      }

      const smX = prev.data.x + (currentData.x - prev.data.x) * alpha;
      const smY = prev.data.y + (currentData.y - prev.data.y) * alpha;
      const smTipX = prev.data.tipX + (currentData.tipX - prev.data.tipX) * alpha;
      const smTipY = prev.data.tipY + (currentData.tipY - prev.data.tipY) * alpha;
      const smSize = prev.data.size + (currentData.size - prev.data.size) * alpha;

      const smoothedData = {
        x: smX,
        y: smY,
        size: smSize,
        visibility: w.visibility,
        tipX: smTipX,
        tipY: smTipY,
        isHeld: false
      };

      palmSmoothers[key] = { data: smoothedData, lostCount: 0 };
      return smoothedData;
    }

    // ==========================================
    // 원소 마법 지팡이 렌더러 (오른손: 불 지팡이, 왼손: 냉기 지팡이)
    // 손바닥 중심(0, 0)으로 스틱 손잡이(Grip)를 쥐고 있는 마스터피스 렌더링
    // ==========================================
    function drawElementalStaff(ctx, palm, isRightHand) {
      if (!palm) return;
      const { x, y, size } = palm;

      ctx.save();
      ctx.translate(x, y);

      const angle = isRightHand ? -Math.PI * 0.16 : Math.PI * 0.16;
      ctx.rotate(angle);

      // 규격 정의:
      // (0, 0)은 손바닥 중심 -> 스틱 손잡이가 위치함
      // shaftBottom: 손바닥 아래로 뻗어나온 스틱 밑동과 폼멜 (+size * 0.48)
      // shaftTop: 손바닥 위로 솟아오른 스틱 상단 결속부 (-size * 0.96)
      const shaftW = Math.max(6, size * 0.085);
      const shaftBottom = size * 0.48;
      const shaftTop = -size * 0.96;
      const totalShaftLen = shaftBottom - shaftTop;

      // 1. 관통하는 전체 스틱 샤프트 (Staff Shaft Body)
      const shaftGrad = ctx.createLinearGradient(-shaftW/2, shaftTop, shaftW/2, shaftBottom);
      if (isRightHand) {
        shaftGrad.addColorStop(0, '#ffd700');
        shaftGrad.addColorStop(0.2, '#7c2d12');
        shaftGrad.addColorStop(0.5, '#2e0f06');
        shaftGrad.addColorStop(0.8, '#7c2d12');
        shaftGrad.addColorStop(1, '#ffd700');
      } else {
        shaftGrad.addColorStop(0, '#ffffff');
        shaftGrad.addColorStop(0.2, '#38bdf8');
        shaftGrad.addColorStop(0.5, '#0c4a6e');
        shaftGrad.addColorStop(0.8, '#38bdf8');
        shaftGrad.addColorStop(1, '#e0f2fe');
      }

      ctx.fillStyle = shaftGrad;
      ctx.strokeStyle = isRightHand ? '#ffd700' : '#bae6fd';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-shaftW / 2, shaftTop, shaftW, totalShaftLen, 4);
      ctx.fill();
      ctx.stroke();

      // 샤프트 하이라이트 라인 (원통 입체감)
      ctx.strokeStyle = isRightHand ? 'rgba(255, 230, 120, 0.45)' : 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = Math.max(1.5, shaftW * 0.22);
      ctx.beginPath();
      ctx.moveTo(-shaftW * 0.12, shaftTop + 6);
      ctx.lineTo(-shaftW * 0.12, shaftBottom - 6);
      ctx.stroke();

      // 2. 손바닥 그립부 (Hand Grip Section: 손바닥으로 스틱을 단단히 잡은 부분)
      const gripH = size * 0.44;
      const gripTop = -gripH / 2;
      const gripBottom = gripH / 2;
      const gripW = shaftW * 1.35;

      // 다크 가죽 랩핑 베이스
      ctx.fillStyle = isRightHand ? '#261208' : '#082538';
      ctx.beginPath();
      ctx.roundRect(-gripW / 2, gripTop, gripW, gripH, 3);
      ctx.fill();

      // 그립 상단/하단 고정 황금/은빛 칼라 링
      ctx.fillStyle = isRightHand ? '#ffd700' : '#e0f2fe';
      ctx.shadowColor = isRightHand ? '#ff8800' : '#00e5ff';
      ctx.shadowBlur = 6;
      ctx.fillRect(-gripW * 0.6, gripTop - 2, gripW * 1.2, 5);
      ctx.fillRect(-gripW * 0.6, gripBottom - 3, gripW * 1.2, 5);

      // 나선형 교차 스트랩 랩핑 (Cross-stitch Leather Bindings)
      ctx.strokeStyle = isRightHand ? '#d97706' : '#38bdf8';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      const numWraps = 5;
      for (let w = 0; w < numWraps; w++) {
        const wy = gripTop + (gripH / numWraps) * (w + 0.5);
        ctx.beginPath();
        ctx.moveTo(-gripW / 2, wy - 4);
        ctx.lineTo(gripW / 2, wy + 4);
        ctx.stroke();
      }

      // 3. 지팡이 하단 폼멜 (Staff Pommel & Base Focus Gem)
      ctx.save();
      ctx.fillStyle = isRightHand ? '#ffd700' : '#bae6fd';
      ctx.shadowColor = isRightHand ? '#ff6600' : '#00e5ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, shaftBottom, shaftW * 0.9, 0, Math.PI * 2);
      ctx.fill();

      // 폼멜 끝 보석
      ctx.fillStyle = isRightHand ? '#ff3300' : '#0284c7';
      ctx.beginPath();
      ctx.arc(0, shaftBottom + 4, shaftW * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 4. 지팡이 상단 헤드 마운트 & 날카롭고 뾰족한 아케인 크리스탈 첨탑 (Sharp Pointed Arcane Crystal Spire)
      const spireTipY = -size * 1.42; // 지팡이 최상단 뾰족한 끝점 (tipX, tipY와 정확히 일치)
      const spireBaseY = shaftTop;
      const spireMidY = shaftTop - size * 0.22;
      const spireHalfW = shaftW * 1.45;
      const crystalMidW = size * 0.13;

      // 4-1. 크리스탈 고정 황금/미스릴 소켓 칼라
      ctx.save();
      ctx.fillStyle = isRightHand ? '#ffd700' : '#e0f2fe';
      ctx.shadowColor = isRightHand ? '#ff8800' : '#00e5ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(-spireHalfW, spireBaseY - 4, spireHalfW * 2, 7, 3);
      ctx.fill();

      // 소켓 좌우 지지 브래킷 클로 (뾰족한 결정을 감싸쥐는 형태)
      ctx.strokeStyle = isRightHand ? '#ffd700' : '#bae6fd';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-spireHalfW * 0.9, spireBaseY);
      ctx.lineTo(-crystalMidW * 1.15, spireMidY + 4);
      ctx.lineTo(-crystalMidW * 0.7, spireMidY - 2);
      ctx.moveTo(spireHalfW * 0.9, spireBaseY);
      ctx.lineTo(crystalMidW * 1.15, spireMidY + 4);
      ctx.lineTo(crystalMidW * 0.7, spireMidY - 2);
      ctx.stroke();
      ctx.restore();

      // 4-2. 뾰족한 크리스탈 아우라 (Sharp Spire Mana Glow)
      const auraGrad = ctx.createRadialGradient(0, spireMidY, 4, 0, spireMidY, size * 0.48);
      if (isRightHand) {
        auraGrad.addColorStop(0, 'rgba(255, 240, 160, 0.95)');
        auraGrad.addColorStop(0.35, 'rgba(255, 110, 0, 0.7)');
        auraGrad.addColorStop(0.75, 'rgba(220, 30, 0, 0.25)');
        auraGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
      } else {
        auraGrad.addColorStop(0, 'rgba(245, 255, 255, 0.95)');
        auraGrad.addColorStop(0.35, 'rgba(56, 189, 248, 0.7)');
        auraGrad.addColorStop(0.75, 'rgba(2, 132, 199, 0.25)');
        auraGrad.addColorStop(1, 'rgba(0, 150, 255, 0)');
      }
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, spireMidY, size * 0.48, 0, Math.PI * 2);
      ctx.fill();

      // 4-3. 뾰족한 입체 크리스탈 몸체 (Faceted Sharp Crystal Body)
      ctx.save();
      // 좌측 면 (음영 패싯)
      const leftFacetGrad = ctx.createLinearGradient(-crystalMidW, spireMidY, 0, spireTipY);
      if (isRightHand) {
        leftFacetGrad.addColorStop(0, '#991b1b');
        leftFacetGrad.addColorStop(0.5, '#dc2626');
        leftFacetGrad.addColorStop(1, '#ffedd5');
      } else {
        leftFacetGrad.addColorStop(0, '#075985');
        leftFacetGrad.addColorStop(0.5, '#0284c7');
        leftFacetGrad.addColorStop(1, '#f0f9ff');
      }
      ctx.fillStyle = leftFacetGrad;
      ctx.beginPath();
      ctx.moveTo(0, spireTipY); // 날카로운 최상단 끝점
      ctx.lineTo(-crystalMidW, spireMidY);
      ctx.lineTo(-shaftW * 0.65, spireBaseY);
      ctx.lineTo(0, spireBaseY);
      ctx.closePath();
      ctx.fill();

      // 우측 면 (하이라이트 패싯)
      const rightFacetGrad = ctx.createLinearGradient(0, spireTipY, crystalMidW, spireMidY);
      if (isRightHand) {
        rightFacetGrad.addColorStop(0, '#ffffff');
        rightFacetGrad.addColorStop(0.4, '#f97316');
        rightFacetGrad.addColorStop(1, '#ea580c');
      } else {
        rightFacetGrad.addColorStop(0, '#ffffff');
        rightFacetGrad.addColorStop(0.4, '#38bdf8');
        rightFacetGrad.addColorStop(1, '#0ea5e9');
      }
      ctx.fillStyle = rightFacetGrad;
      ctx.beginPath();
      ctx.moveTo(0, spireTipY);
      ctx.lineTo(0, spireBaseY);
      ctx.lineTo(shaftW * 0.65, spireBaseY);
      ctx.lineTo(crystalMidW, spireMidY);
      ctx.closePath();
      ctx.fill();

      // 크리스탈 날카로운 외곽선 및 중앙 능선 (Sharp Edges & Center Ridge)
      ctx.strokeStyle = isRightHand ? 'rgba(255, 245, 200, 0.95)' : 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 1.8;
      ctx.shadowColor = isRightHand ? '#ff8800' : '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      // 중앙 척추 능선 (끝점으로 곧게 뻗음)
      ctx.moveTo(0, spireBaseY);
      ctx.lineTo(0, spireTipY);
      // 외곽선
      ctx.moveTo(-shaftW * 0.65, spireBaseY);
      ctx.lineTo(-crystalMidW, spireMidY);
      ctx.lineTo(0, spireTipY);
      ctx.lineTo(crystalMidW, spireMidY);
      ctx.lineTo(shaftW * 0.65, spireBaseY);
      ctx.stroke();

      // 4-4. 최상단 뾰족한 끝점의 눈부신 아케인 스파클 렌즈 플레어 (Sharp Needle Point Glint)
      const time = Date.now() * 0.006;
      const sparkPulse = 0.85 + Math.sin(time * 3) * 0.25;
      const sparkLen = size * 0.22 * sparkPulse;
      const sparkCross = size * 0.12 * sparkPulse;

      ctx.save();
      ctx.translate(0, spireTipY);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      ctx.shadowColor = isRightHand ? '#ffd700' : '#00e5ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(0, -sparkLen);
      ctx.lineTo(0, sparkLen * 0.6);
      ctx.moveTo(-sparkCross, 0);
      ctx.lineTo(sparkCross, 0);
      ctx.stroke();

      // 침 끝 중심 핫스팟
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 3.2 * sparkPulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.restore();

      // 4-5. 궤도 원소 효과 (주위를 맴도는 불꽃 또는 얼음 조각)
      if (isRightHand) {
        for (let f = 0; f < 3; f++) {
          const fAng = time * 2.5 + f * (Math.PI * 2 / 3);
          const fx = Math.cos(fAng) * (crystalMidW * 1.5);
          const fy = spireMidY + Math.sin(fAng * 2) * (size * 0.12) - (size * 0.08);
          ctx.save();
          ctx.beginPath();
          ctx.arc(fx, fy, 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 230, 80, 0.9)';
          ctx.shadowColor = '#ff4400';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        }
      } else {
        for (let c = 0; c < 3; c++) {
          const cAng = -time * 2.2 + c * (Math.PI * 2 / 3);
          const cx = Math.cos(cAng) * (crystalMidW * 1.5);
          const cy = spireMidY + Math.sin(cAng * 2) * (size * 0.12) - (size * 0.08);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(time * 3 + c);
          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.lineTo(3.5, 0);
          ctx.lineTo(0, 5);
          ctx.lineTo(-3.5, 0);
          ctx.closePath();
          ctx.fillStyle = '#e0f2fe';
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      // 지팡이 라벨 (폼멜 아래)
      ctx.save();
      ctx.font = `bold ${Math.max(12, Math.floor(size * 0.16))}px 'Cinzel', 'Gowun Batang', serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = isRightHand ? '#ffe082' : '#bae6fd';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 5;
      ctx.fillText(isRightHand ? "불 지팡이" : "냉기 지팡이", 0, shaftBottom + 18);
      ctx.restore();

      ctx.restore();
    }

    // 메뉴 화면용: 손바닥에 붙은 크리스탈 첨탑만 렌더링 (지팡이 없음)
    function drawCrystalTipOnly(ctx, palm, isRightHand) {
      if (!palm) return;
      const { x, y, size } = palm;
      const crystalSize = size * 0.55;
      const time = Date.now() * 0.005;
      const pulse = 0.8 + Math.sin(time * 3) * 0.2;

      ctx.save();
      ctx.translate(x, y);
      const angle = isRightHand ? -Math.PI * 0.12 : Math.PI * 0.12;
      ctx.rotate(angle);

      const tipY = -crystalSize * 1.1;
      const midY = -crystalSize * 0.3;
      const baseY = crystalSize * 0.2;
      const halfW = crystalSize * 0.32;
      const midW = crystalSize * 0.18;

      // 아우라 글로우
      const auraGrad = ctx.createRadialGradient(0, midY, 2, 0, midY, crystalSize * 0.65);
      if (isRightHand) {
        auraGrad.addColorStop(0, `rgba(255, 220, 80, ${0.85 * pulse})`);
        auraGrad.addColorStop(0.5, `rgba(255, 80, 0, ${0.45 * pulse})`);
        auraGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
      } else {
        auraGrad.addColorStop(0, `rgba(200, 255, 255, ${0.85 * pulse})`);
        auraGrad.addColorStop(0.5, `rgba(0, 180, 255, ${0.45 * pulse})`);
        auraGrad.addColorStop(1, 'rgba(0, 100, 255, 0)');
      }
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, midY, crystalSize * 0.65, 0, Math.PI * 2);
      ctx.fill();

      // 크리스탈 왼쪽 면
      const lGrad = ctx.createLinearGradient(-halfW, baseY, 0, tipY);
      lGrad.addColorStop(0, isRightHand ? '#7c2d12' : '#075985');
      lGrad.addColorStop(0.6, isRightHand ? '#dc2626' : '#0284c7');
      lGrad.addColorStop(1, isRightHand ? '#fff0d0' : '#f0f9ff');
      ctx.fillStyle = lGrad;
      ctx.beginPath();
      ctx.moveTo(0, tipY); ctx.lineTo(-midW, midY);
      ctx.lineTo(-halfW, baseY); ctx.lineTo(0, baseY);
      ctx.closePath(); ctx.fill();

      // 크리스탈 오른쪽 면
      const rGrad = ctx.createLinearGradient(0, tipY, midW, midY);
      rGrad.addColorStop(0, '#ffffff');
      rGrad.addColorStop(0.5, isRightHand ? '#f97316' : '#38bdf8');
      rGrad.addColorStop(1, isRightHand ? '#ea580c' : '#0ea5e9');
      ctx.fillStyle = rGrad;
      ctx.beginPath();
      ctx.moveTo(0, tipY); ctx.lineTo(0, baseY);
      ctx.lineTo(halfW, baseY); ctx.lineTo(midW, midY);
      ctx.closePath(); ctx.fill();

      // 외곽선 & 중앙 능선
      ctx.strokeStyle = isRightHand ? 'rgba(255,245,200,0.9)' : 'rgba(200,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = isRightHand ? '#ff8800' : '#00e5ff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(0, baseY); ctx.lineTo(0, tipY);
      ctx.moveTo(-halfW, baseY); ctx.lineTo(-midW, midY); ctx.lineTo(0, tipY);
      ctx.lineTo(midW, midY); ctx.lineTo(halfW, baseY);
      ctx.stroke();

      // 끝점 스파클
      const sparkLen = crystalSize * 0.28 * pulse;
      ctx.save();
      ctx.translate(0, tipY);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.shadowColor = isRightHand ? '#ffd700' : '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(0, -sparkLen); ctx.lineTo(0, sparkLen * 0.5);
      ctx.moveTo(-sparkLen * 0.55, 0); ctx.lineTo(sparkLen * 0.55, 0);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 2.8 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // ==========================================
    // 커서 및 지팡이 렌더링
    // ==========================================
    let leftCursorTrail = [];
    let rightCursorTrail = [];
    function renderCursors(results, ctx, width, height) {
      if (!results.poseLandmarks) return;
      const leftPalm = getPalm(results.poseLandmarks, true, width, height);
      const rightPalm = getPalm(results.poseLandmarks, false, width, height);

      const updateTrail = (palm, trailArr, colorFn) => {
        if (!palm) return;
        trailArr.push({ x: palm.x, y: palm.y, life: 1.0, size: palm.size * 0.3 });
        if (trailArr.length > 10) trailArr.shift();
        for (let i = 0; i < trailArr.length; i++) {
          let t = trailArr[i];
          t.life -= 0.09;
          if (t.life <= 0) continue;
          ctx.save();
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.size * t.life, 0, Math.PI * 2);
          ctx.fillStyle = colorFn(t.life);
          ctx.shadowColor = colorFn(1.0);
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      };

      updateTrail(leftPalm, leftCursorTrail, (a) => `rgba(0, 220, 255, ${a * 0.4})`);
      updateTrail(rightPalm, rightCursorTrail, (a) => `rgba(255, 140, 0, ${a * 0.4})`);

      // 메뉴/결과/게임오버: 크리스탈 팁만, 플레이 중: 풀 지팡이
      const isMenuMode = (gameState === 'menu_main' || gameState === 'menu_sub' ||
                          gameState === 'result' || gameState === 'gameover' ||
                          gameState === 'paused');
      if (isMenuMode) {
        if (leftPalm) drawCrystalTipOnly(ctx, leftPalm, false);
        if (rightPalm) drawCrystalTipOnly(ctx, rightPalm, true);
      } else {
        if (leftPalm) drawElementalStaff(ctx, leftPalm, false); // 왼손: 냉기 지팡이
        if (rightPalm) drawElementalStaff(ctx, rightPalm, true);  // 오른손: 불 지팡이
      }
    }


    // 도형 그리기 함수 (문제에서 shape 데이터가 있을 경우)
    function drawShapeData(ctx, shapeObj) {
        ctx.save();
        ctx.strokeStyle = 'white';
        ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
        // 3배 확대로 인해 선 굵기가 같이 커지므로 기본 굵기를 2로 조정
        ctx.lineWidth = 2;
        // 텍스트(알파벳 베이스라인 위로 올라옴)와 겹치지 않도록 높이에 비례하여 위로 띄움
        let offset = Math.max(180, (window.innerHeight || 800) * 0.25);
        ctx.translate(0, -offset); 
        ctx.scale(3, 3); 
        
        if (shapeObj.type === 'rect') {
            ctx.strokeRect(-60, -40, 120, 80);
            ctx.fillRect(-60, -40, 120, 80);
            ctx.fillStyle = 'yellow'; ctx.font = '24px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, 0, 60); 
            if (shapeObj.h) ctx.fillText(shapeObj.h, 80, 0); 
        } else if (shapeObj.type === 'square') {
            let s = 45;
            ctx.strokeRect(-s, -s, s*2, s*2);
            ctx.fillRect(-s, -s, s*2, s*2);
            ctx.fillStyle = 'yellow'; ctx.font = '22px sans-serif';
            if (shapeObj.w) {
              ctx.fillText(shapeObj.w, 0, s + 25);
              ctx.fillText(shapeObj.w, s + 20, 0);
            }
        } else if (shapeObj.type === 'triangle') {
            ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(-50, 40); ctx.lineTo(50, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '24px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, 0, 60); 
            if (shapeObj.h) ctx.fillText(shapeObj.h, 30, -10); 
        } else if (shapeObj.type === 'equilateral_triangle') {
            ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(-50, 40); ctx.lineTo(50, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '22px sans-serif';
            if (shapeObj.w) {
              ctx.fillText(shapeObj.w, 0, 65);
              ctx.fillText(shapeObj.w, -40, -10);
              ctx.fillText(shapeObj.w, 40, -10);
            }
        } else if (shapeObj.type === 'isosceles_triangle') {
            ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-45, 40); ctx.lineTo(45, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '22px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, 0, 65);
            if (shapeObj.a) {
              ctx.fillText(shapeObj.a, -40, -15);
              ctx.fillText(shapeObj.a, 40, -15);
            }
        } else if (shapeObj.type === 'parallelogram') {
            ctx.beginPath(); ctx.moveTo(-30, -35); ctx.lineTo(60, -35); ctx.lineTo(30, 35); ctx.lineTo(-60, 35); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '22px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, -15, 60);
            if (shapeObj.h) ctx.fillText(shapeObj.h, 60, 0);
        } else if (shapeObj.type === 'trapezoid') {
            ctx.beginPath(); ctx.moveTo(-35, -35); ctx.lineTo(35, -35); ctx.lineTo(65, 35); ctx.lineTo(-65, 35); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
            if (shapeObj.a) ctx.fillText(shapeObj.a, 0, -45);
            if (shapeObj.b) ctx.fillText(shapeObj.b, 0, 60);
            if (shapeObj.h) ctx.fillText('h=' + shapeObj.h, 70, 0);
        } else if (shapeObj.type === 'circle') {
            ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2);
            ctx.stroke(); ctx.fill();
            if (shapeObj.r) {
              ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(45, 0); ctx.stroke();
              ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
              ctx.fillText('r=' + shapeObj.r, 22, -10);
            }
        } else if (shapeObj.type === 'pentagon') {
            ctx.beginPath();
            for(let i=0; i<5; i++) {
              let ang = -Math.PI/2 + (i * Math.PI * 2 / 5);
              let px = Math.cos(ang) * 50, py = Math.sin(ang) * 50;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.stroke(); ctx.fill();
        } else if (shapeObj.type === 'hexagon') {
            ctx.beginPath();
            for(let i=0; i<6; i++) {
              let ang = (i * Math.PI / 3);
              let px = Math.cos(ang) * 50, py = Math.sin(ang) * 50;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.stroke(); ctx.fill();
        } else if (shapeObj.type === 'cube') {
            let s = 40;
            ctx.beginPath();
            ctx.rect(-s, -s, s*2, s*2); 
            ctx.moveTo(-s, -s); ctx.lineTo(-s+20, -s-20); ctx.lineTo(s+20, -s-20); ctx.lineTo(s, -s);
            ctx.moveTo(s+20, -s-20); ctx.lineTo(s+20, s-20); ctx.lineTo(s, s);
            ctx.stroke();
            ctx.fillStyle = 'yellow'; ctx.font = '24px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, 0, s + 25);
        } else if (shapeObj.type === 'cuboid') {
            let sx = 50, sy = 30, sz = 25;
            ctx.beginPath();
            ctx.rect(-sx, -sy, sx*2, sy*2);
            ctx.moveTo(-sx, -sy); ctx.lineTo(-sx+sz, -sy-sz); ctx.lineTo(sx+sz, -sy-sz); ctx.lineTo(sx, -sy);
            ctx.moveTo(sx+sz, -sy-sz); ctx.lineTo(sx+sz, sy-sz); ctx.lineTo(sx, sy);
            ctx.stroke();
            ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
            if (shapeObj.w) ctx.fillText(shapeObj.w, 0, sy + 22);
            if (shapeObj.h) ctx.fillText(shapeObj.h, sx + 22, 0);
            if (shapeObj.d) ctx.fillText(shapeObj.d, sx/2 + sz, -sy/2 - sz);
        } else if (shapeObj.type === 'triangle_angle') {
            ctx.beginPath(); ctx.moveTo(0, -55); ctx.lineTo(-65, 40); ctx.lineTo(65, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
            ctx.fillText(shapeObj.a + '°', -40, 30);
            ctx.fillText(shapeObj.b + '°', 40, 30);
            ctx.fillStyle = '#FF5555';
            ctx.fillText('?°', 0, -25);
        } else if (shapeObj.type === 'right_triangle_angle') {
            ctx.beginPath(); ctx.moveTo(-50, -50); ctx.lineTo(-50, 40); ctx.lineTo(50, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-50, 25); ctx.lineTo(-35, 25); ctx.lineTo(-35, 40); ctx.stroke();
            ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
            ctx.fillText(shapeObj.a + '°', 25, 28);
            ctx.fillStyle = '#FF5555';
            ctx.fillText('?°', -30, -30);
        } else if (shapeObj.type === 'isosceles_angle') {
            ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-55, 40); ctx.lineTo(55, 40); ctx.closePath();
            ctx.stroke(); ctx.fill();
            ctx.fillStyle = 'yellow'; ctx.font = '20px sans-serif';
            ctx.fillText(shapeObj.a + '°', 0, -35);
            ctx.fillStyle = '#FF5555';
            ctx.fillText('?°', -35, 30);
            ctx.fillText('?°', 35, 30);
        } else if (shapeObj.type === 'stack_cubes') {
            const grid = shapeObj.grid || [[1,1],[1,0]];
            const numR = grid.length;
            const numC = grid[0].length;
            const sz = (numR > 2 || numC > 2) ? 23 : 28;
            const cos30 = Math.cos(Math.PI / 6);
            const sin30 = Math.sin(Math.PI / 6);
            ctx.translate(0, 20);
            ctx.lineWidth = 2;
            
            const midC_minus_R = ((numC - 1) - (numR - 1)) / 2;
            const baseR_plus_C = ((numC - 1) + (numR - 1)) / 2 - 1.0;

            const cells = [];
            for (let r = 0; r < numR; r++) {
              for (let c = 0; c < numC; c++) {
                if (grid[r][c] > 0) cells.push({ r, c, count: grid[r][c] });
              }
            }
            cells.sort((a, b) => (a.r + a.c) - (b.r + b.c));

            for (let cell of cells) {
              const { r, c, count } = cell;
              for (let z = 0; z < count; z++) {
                let bx = (c - r - midC_minus_R) * (sz * cos30);
                let by = ((c + r) - baseR_plus_C) * (sz * sin30) - z * sz;

                // 윗면 (Top)
                ctx.fillStyle = '#4FC3F7';
                ctx.beginPath();
                ctx.moveTo(bx, by - sz * sin30);
                ctx.lineTo(bx + sz * cos30, by);
                ctx.lineTo(bx, by + sz * sin30);
                ctx.lineTo(bx - sz * cos30, by);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 좌측면 (Left)
                ctx.fillStyle = '#0288D1';
                ctx.beginPath();
                ctx.moveTo(bx - sz * cos30, by);
                ctx.lineTo(bx, by + sz * sin30);
                ctx.lineTo(bx, by + sz * sin30 + sz);
                ctx.lineTo(bx - sz * cos30, by + sz);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 우측면 (Right)
                ctx.fillStyle = '#01579B';
                ctx.beginPath();
                ctx.moveTo(bx, by + sz * sin30);
                ctx.lineTo(bx + sz * cos30, by);
                ctx.lineTo(bx + sz * cos30, by + sz);
                ctx.lineTo(bx, by + sz * sin30 + sz);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
              }
            }
            if (shapeObj.view === 'top') {
              ctx.fillStyle = '#FFEB3B'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
              ctx.fillText('↓ [위에서 내려다본 모습]', 0, -60);
            } else if (shapeObj.view === 'front') {
              ctx.fillStyle = '#FFEB3B'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
              ctx.fillText('↑ [정면에서 본 모습]', 0, 75);
            } else if (shapeObj.view === 'side') {
              ctx.fillStyle = '#FFEB3B'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
              const sideX = numC > 2 ? 95 : 85;
              ctx.fillText('→ [우측에서 본 모습]', sideX, 0);
            }
        } else if (shapeObj.type === 'cube_net') {
            const sz = 24;
            const layout = shapeObj.layout || [
              { r: 0, c: 1, val: shapeObj.faces ? shapeObj.faces[0] : 2 },
              { r: 1, c: 0, val: shapeObj.faces ? shapeObj.faces[1] : 4 },
              { r: 1, c: 1, val: shapeObj.faces ? shapeObj.faces[2] : 1 },
              { r: 1, c: 2, val: shapeObj.faces ? shapeObj.faces[3] : 3 },
              { r: 2, c: 1, val: shapeObj.faces ? shapeObj.faces[4] : 5 },
              { r: 3, c: 1, val: shapeObj.faces ? shapeObj.faces[5] : 6 }
            ];
            ctx.translate(-sz * 1.5, -sz * 1.5);
            for (let cell of layout) {
              let cx = cell.c * sz;
              let cy = cell.r * sz;
              ctx.fillStyle = (cell.val === shapeObj.face) ? '#FFCC00' : 'rgba(0, 200, 255, 0.4)';
              ctx.fillRect(cx, cy, sz, sz);
              ctx.strokeStyle = 'white';
              ctx.lineWidth = 2;
              ctx.strokeRect(cx, cy, sz, sz);
              ctx.fillStyle = (cell.val === shapeObj.face) ? '#000' : '#FFF';
              ctx.font = 'bold 16px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(cell.val, cx + sz/2, cy + sz/2);
            }
            if (shapeObj.points) {
              ctx.fillStyle = '#FF5252';
              ctx.font = 'bold 16px sans-serif';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              for (let pt of shapeObj.points) {
                ctx.fillText(pt.t, pt.c * sz, pt.r * sz);
              }
            }
        } else if (shapeObj.type === 'arrow_rot') {
            ctx.fillStyle = 'yellow';
            ctx.font = 'bold 50px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(shapeObj.from || '→', -55, 0);
            
            ctx.fillStyle = '#00FF00';
            ctx.font = 'bold 19px sans-serif';
            let dirText = shapeObj.deg > 0 ? `⟳ 시계 ${shapeObj.deg}°` : `⟲ 반시계 ${Math.abs(shapeObj.deg)}°`;
            ctx.fillText(dirText, 40, -25);
            ctx.fillStyle = '#FF5555';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('➔  [ ? ]', 40, 15);
        }
        ctx.restore();
    }

    function parseCsvLine(line) {
        const row = [];
        let inQuotes = false;
        let token = "";
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                if (inQuotes && line[i+1] === '"') {
                    token += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                row.push(token.trim());
                token = "";
            } else {
                token += char;
            }
        }
        row.push(token.trim());
        return row;
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(...args) { 
       if (Array.isArray(args[0])) return args[0][rand(0, args[0].length - 1)];
       return args[rand(0, args.length - 1)]; 
    }
    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
    function sup(n) {
      const sups = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
      return String(n).split('').map(d => sups[d] || d).join('');
    }
    function repeatMul(num, count) {
      return Array(Math.max(1, count)).fill(num).join(' × ');
    }
    function repeatAdd(num, count) {
      return Array(Math.max(1, count)).fill(num).join(' + ');

    // 긴 문제가 화면을 벗어나지 않도록 의미 단위 및 어절 균형을 고려하여 보기 좋게 줄바꿈
    function splitQuestionText(ctx, text, maxWidth) {
      if (!text) return [""];
      if (ctx.measureText(text).width <= maxWidth) {
        return [text];
      }

      // 1. 구두점, 괄호, 콜론, 조사 등 자연스러운 의미 구분자를 우선 검색
      const delimiters = [
        /(?<=\?|\!)\s+/,
        /(?<=\]|\))\s+/,
        /(?<=:)\s+/,
        /(?<=,)\s+/,
        /(?<=(?:과|와|때|면))\s+/
      ];

      for (let delim of delimiters) {
        const parts = text.split(delim);
        if (parts.length >= 2) {
          for (let splitIdx = 1; splitIdx < parts.length; splitIdx++) {
            let part1 = parts.slice(0, splitIdx).join(' ').trim();
            let part2 = parts.slice(splitIdx).join(' ').trim();
            if (ctx.measureText(part1).width <= maxWidth && ctx.measureText(part2).width <= maxWidth) {
              return [part1, part2];
            }
          }
        }
      }

      // 2. 띄어쓰기(어절) 단위로 2줄로 나누었을 때 좌우 균형이 가장 잘 맞는 분기점 탐색
      const words = text.split(' ');
      let bestSplit = null;
      let minDiff = Infinity;

      for (let i = 1; i < words.length; i++) {
        let line1 = words.slice(0, i).join(' ');
        let line2 = words.slice(i).join(' ');
        let w1 = ctx.measureText(line1).width;
        let w2 = ctx.measureText(line2).width;

        if (w1 <= maxWidth && w2 <= maxWidth) {
          let diff = Math.abs(w1 - w2);
          if (diff < minDiff) {
            minDiff = diff;
            bestSplit = [line1, line2];
          }
        }
      }

      if (bestSplit) return bestSplit;

      // 3. 3줄 이상 필요한 긴 문장이거나 긴 단어에 대한 그리디 분할
      let lines = [];
      let cur = '';
      for (let word of words) {
        let test = cur ? (cur + ' ' + word) : word;
        if (ctx.measureText(test).width <= maxWidth) {
          cur = test;
        } else {
          if (cur) lines.push(cur);
          if (ctx.measureText(word).width > maxWidth) {
            let sub = '';
            for (let ch of word) {
              if (ctx.measureText(sub + ch).width <= maxWidth) {
                sub += ch;
              } else {
                lines.push(sub);
                sub = ch;
              }
            }
            cur = sub;
          } else {
            cur = word;
          }
        }
      }
      if (cur) lines.push(cur);
      return lines;
    }

    // 화면 너비에 맞춰 폰트 크기 및 줄간격을 자동 조절하고 선명한 외곽선과 함께 렌더링
    function renderWrappedQuestion(ctx, text, centerX, centerY, maxWidth, baseFontSize, onParchment = true) {
      let fontSize = baseFontSize;
      if (text.length > 30) fontSize = Math.floor(baseFontSize * 0.75);
      else if (text.length > 18) fontSize = Math.floor(baseFontSize * 0.85);

      ctx.font = `bold ${fontSize}px 'Cinzel', 'Gowun Batang', serif`;
      let lines = splitQuestionText(ctx, text, maxWidth);

      // 3줄 이상인 경우 폰트를 조금 줄여서 2줄 내로 보기 좋게 압축
      while (lines.length > 2 && fontSize > Math.floor(baseFontSize * 0.55)) {
        fontSize -= 2;
        ctx.font = `bold ${fontSize}px 'Cinzel', 'Gowun Batang', serif`;
        lines = splitQuestionText(ctx, text, maxWidth);
      }

      const lineHeight = fontSize * 1.35;
      const totalH = (lines.length - 1) * lineHeight;
      const startY = centerY - totalH / 2;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (onParchment) {
        ctx.strokeStyle = 'rgba(255, 235, 190, 0.5)';
        ctx.lineWidth = Math.max(2, fontSize * 0.05);
        ctx.fillStyle = '#2c1505';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 2;
      } else {
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.lineWidth = Math.max(3, fontSize * 0.1);
        ctx.fillStyle = '#ffe082';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
      }

      for (let i = 0; i < lines.length; i++) {
        let lineY = startY + i * lineHeight;
        if (!onParchment) ctx.strokeText(lines[i], centerX, lineY);
        ctx.fillText(lines[i], centerX, lineY);
      }

      return { lines, fontSize, totalH };
    }

    function createRawQuestion() {
      const candidates = questionDB.filter(q => q.level === currentLevel && q.subLevel === currentSubLevel);
      if (candidates.length === 0) return { q: "문제를 불러오는 중...", c: "0", w: "1", shape: null, template: "" };
      
      // 단순 연산(1-1, 1-2, 1-3, 1-4, 2-3, 2-5, 4-2) 외의 모든 세부단계에서는
      // 현재 라운드(10문제) 동안 이미 출제된 유형(qTemp)을 제외한 후보군에서 추출하여
      // 숫자만 바뀐 동일한 유형의 문제가 연속해서 나오지 않도록 100% 유형 다양성을 보장합니다.
      const isPureArithmetic = (currentLevel === 1 && [1,2,3,4].includes(currentSubLevel)) ||
                               (currentLevel === 2 && [3,5].includes(currentSubLevel)) ||
                               (currentLevel === 4 && currentSubLevel === 2);

      let availableCandidates = candidates;
      if (!isPureArithmetic) {
        let unused = candidates.filter(c => !currentRoundTemplates.includes(c.qTemp));
        if (unused.length > 0) {
          availableCandidates = unused;
        } else {
          // 해당 세부단계의 모든 유형을 한 번씩 다 풀었으면 라운드 템플릿 목록을 초기화하여 순환
          currentRoundTemplates = [];
          availableCandidates = candidates;
        }
      }
      
      let t, A, B, C, D, q, c, w;
      let evalAttempts = 0;
      do {
        t = pick(availableCandidates);
        A = 0; B = 0; C = 0; D = 0;
        try { A = eval(t.va); } catch(e){ console.error("A eval error", e); }
        try { B = eval(t.vb); } catch(e){ console.error("B eval error", e); }
        try { C = eval(t.vc); } catch(e){ console.error("C eval error", e); }
        try { D = eval(t.vd); } catch(e){ console.error("D eval error", e); }
        
        q = t.qTemp.replace(/\{A\}/g, A).replace(/\{B\}/g, B).replace(/\{C\}/g, C).replace(/\{D\}/g, D);
        q = q.replace(/\{([^}]+)\}/g, (m, expr) => {
          try { return eval(expr); } catch(e) { return m; }
        });
        
        c = ""; w = "";
        try { c = eval(t.cTemp); } catch(e){ c = "err"; console.error("C eval error", e); }
        try { w = eval(t.wTemp); } catch(e){ w = "err"; console.error("W eval error", e); }
        evalAttempts++;
      } while (c.toString() === w.toString() && evalAttempts < 10);

      // 좌우 동일한 답 방지 보장 (Fallback Guarantee)
      if (c.toString() === w.toString()) {
        if (!isNaN(Number(c))) {
          let numC = Number(c);
          w = (numC === 0 ? 1 : numC + 1).toString();
        } else if (c === '직사각형') {
          w = '정사각형';
        } else if (c === '정사각형') {
          w = '직사각형';
        } else if (c === '=') {
          w = '≠';
        } else if (c === '≠') {
          w = '=';
        } else if (c.endsWith('층')) {
          w = (c === '2층' ? '3층' : '2층');
        } else if (c.endsWith('°')) {
          w = (c === '360°' ? '180°' : '360°');
        } else if (c.endsWith('%')) {
          let pVal = parseInt(c);
          w = (!isNaN(pVal) ? (pVal + 10) + '%' : '50%');
        } else {
          w = c.toString() + "'";
        }
      }
      
      let shapeObj = null;
      if (t.shape && t.shape.trim() !== "" && t.shape.trim() !== "0") {
          try { eval("shapeObj = (" + t.shape + ")"); } catch(e){ console.error("Shape eval error", e, t.shape); }
      }
      
      return { q: q.toString(), c: c.toString(), w: w.toString(), shape: shapeObj, template: t.qTemp };
    }

    function generateQuestion() {
      leftBoxRequiredHand = "left"; 
      rightBoxRequiredHand = "right"; 
      isCrossMode = false;

      let data;
      let attempts = 0;
      let identity = "";
      do {
        data = createRawQuestion();
        let shapeKey = data.shape ? JSON.stringify(data.shape) : "";
        identity = data.q + (shapeKey ? "::" + shapeKey : "");
        attempts++;
      } while (previousQuestions.includes(identity) && attempts < 60);
      
      if (data.template) {
        currentRoundTemplates.push(data.template);
      }
      previousQuestions.push(identity);
      if (previousQuestions.length > 35) previousQuestions.shift(); 

      questionText = data.q;
      questionShape = data.shape;
      
      if (Math.random() > 0.5) { 
         correctSide = "left"; leftAnswerText = data.c; rightAnswerText = data.w; 
      } else { 
         correctSide = "right"; leftAnswerText = data.w; rightAnswerText = data.c; 
      }

      // 좌우 동일 답 최종 방지
      if (leftAnswerText === rightAnswerText) {
        rightAnswerText = leftAnswerText + "'";
      }
    }
